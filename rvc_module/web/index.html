<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RVC // Realizable Vulnerability Correlator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg0: #04060a;
    --bg1: #070b12;
    --glass: rgba(10, 18, 27, 0.52);
    --glass2: rgba(13, 22, 33, 0.66);
    --line: rgba(64, 224, 255, 0.14);
    --line2: rgba(64, 224, 255, 0.28);
    --cyan: #28e7ff;
    --green: #36ffb0;
    --violet: #9d7bff;
    --pink: #ff3d77;
    --amber: #ffc24d;
    --red: #ff3b5c;
    --ink: #d7eef5;
    --ink2: #9fc3cf;
    --muted: #5f7d8a;
    --sev-critical: #ff3b5c;
    --sev-high: #ff7a6b;
    --sev-medium: #ffc24d;
    --sev-low: #36ffb0;
    --sev-unknown: #6f8a93;
    --f-display: "Orbitron", "Share Tech Mono", "Cascadia Code", Consolas, monospace;
    --f-mono: "JetBrains Mono", "Share Tech Mono", "Cascadia Code", Consolas, monospace;
    --f-body: "Inter", "Segoe UI", system-ui, sans-serif;
    --ease: cubic-bezier(.2,.7,.25,1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--f-body); color: var(--ink); font-size: 14px; overflow: hidden;
    -webkit-font-smoothing: antialiased; position: relative;
    background:
      radial-gradient(1200px 700px at 82% -8%, rgba(40,231,255,.10), transparent 55%),
      radial-gradient(900px 600px at -8% 110%, rgba(40,231,255,.07), transparent 52%),
      var(--bg0);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: .5;
    background-image: linear-gradient(rgba(40,231,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(40,231,255,.05) 1px, transparent 1px);
    background-size: 44px 44px; mask-image: radial-gradient(circle at 50% 40%, #000 35%, transparent 85%);
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2; opacity: .35;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.18) 3px);
  }
  #bgfx { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  /* ===== Intro ===== */
  #intro { position: fixed; inset: 0; z-index: 1000; background: radial-gradient(circle at 50% 45%, #0a1018, #03050a 75%); transition: opacity .8s ease, visibility .8s; }
  #intro.hidden { opacity: 0; visibility: hidden; }
  #introCv { width: 100%; height: 100%; display: block; }
  #skip {
    position: absolute; bottom: 26px; right: 30px; z-index: 1001; cursor: pointer;
    font-family: var(--f-mono); font-size: 12px; letter-spacing: .15em; color: var(--ink2);
    background: rgba(40,231,255,.06); border: 1px solid var(--line2); border-radius: 30px; padding: 9px 18px;
    transition: .2s; text-transform: uppercase;
  }
  #skip:hover { color: #fff; background: rgba(40,231,255,.16); box-shadow: 0 0 22px rgba(40,231,255,.35); }

  /* ===== Layout ===== */
  .app { position: relative; z-index: 3; display: grid; grid-template-columns: 92px 1fr 420px; height: 100vh; padding: 22px; gap: 22px; opacity: 0; }
  .app.ready { opacity: 1; }

  /* Sidebar (hover-expand) */
  .railwrap { position: relative; width: 92px; }
  .sidebar {
    position: absolute; top: 0; left: 0; bottom: 0; width: 92px; z-index: 40; overflow: hidden;
    background: var(--glass); backdrop-filter: blur(16px); border: 1px solid var(--line);
    border-radius: 20px; box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 20px 50px rgba(0,0,0,.5);
    display: flex; flex-direction: column; align-items: stretch; padding: 22px 16px; gap: 6px;
    transition: width .35s var(--ease), box-shadow .35s;
  }
  .sidebar:hover { width: 232px; box-shadow: 0 0 30px rgba(40,231,255,.18), 0 24px 60px rgba(0,0,0,.6); }
  .logo {
    height: 50px; min-width: 50px; border-radius: 14px; background: linear-gradient(140deg, #18e0ff, #2e7bff);
    display: flex; align-items: center; gap: 12px; padding: 0 12px; color: #021018; font-weight: 900;
    font-family: var(--f-display); margin-bottom: 22px; box-shadow: 0 0 24px rgba(40,231,255,.5); white-space: nowrap;
  }
  .logo .full { font-size: 13px; letter-spacing: .12em; opacity: 0; transition: opacity .3s; }
  .sidebar:hover .logo .full { opacity: 1; }
  .nav-btn {
    position: relative; height: 52px; border: none; background: transparent; border-radius: 13px; cursor: pointer;
    color: var(--ink2); display: flex; align-items: center; gap: 16px; padding: 0 14px; white-space: nowrap;
    font-family: var(--f-mono); font-size: 12.5px; letter-spacing: .08em; transition: all .22s var(--ease);
  }
  .nav-btn svg { width: 22px; height: 22px; min-width: 22px; }
  .nav-btn .lbl { opacity: 0; transform: translateX(-6px); transition: .28s var(--ease); }
  .sidebar:hover .nav-btn .lbl { opacity: 1; transform: translateX(0); }
  .nav-btn:hover { color: var(--cyan); background: rgba(40,231,255,.07); }
  .nav-btn.active { color: #02131a; background: linear-gradient(140deg, #1ee6ff, #2e9bff); box-shadow: 0 0 22px rgba(40,231,255,.45); }
  .nav-btn .cnt { margin-left: auto; font-size: 11px; opacity: .7; }

  .main { overflow-y: auto; padding-right: 8px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 14px; }
  .search {
    background: var(--glass); border: 1px solid var(--line); border-radius: 14px; display: flex; align-items: center; gap: 11px;
    padding: 13px 18px; width: 380px; transition: .25s; backdrop-filter: blur(10px);
  }
  .search:focus-within { border-color: var(--line2); box-shadow: 0 0 26px rgba(40,231,255,.22); }
  .search input { border: none; outline: none; font-size: 13.5px; width: 100%; color: var(--ink); background: transparent; font-family: var(--f-mono); }
  .search input::placeholder { color: var(--muted); }
  .search svg { width: 18px; height: 18px; color: var(--cyan); }
  .btn {
    border: 1px solid var(--line2); cursor: pointer; border-radius: 13px; padding: 12px 20px; font-size: 12.5px; font-weight: 700;
    font-family: var(--f-mono); letter-spacing: .08em; text-transform: uppercase;
    background: linear-gradient(140deg, rgba(40,231,255,.18), rgba(46,123,255,.12)); color: var(--cyan);
    display: inline-flex; align-items: center; gap: 9px; transition: .22s var(--ease);
  }
  .btn:hover { color: #02131a; background: linear-gradient(140deg, #1ee6ff, #2e9bff); box-shadow: 0 0 26px rgba(40,231,255,.45); transform: translateY(-2px); }
  .btn svg { transition: transform .6s var(--ease); }
  .btn:hover svg { transform: rotate(-180deg); }

  .hero {
    position: relative; overflow: hidden; border-radius: 20px; padding: 28px 32px; margin-bottom: 22px;
    background: linear-gradient(125deg, rgba(40,231,255,.12), rgba(40,231,255,.03)), var(--glass2);
    border: 1px solid var(--line2); box-shadow: 0 0 40px rgba(40,231,255,.10), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(460px 240px at 88% 0%, rgba(40,231,255,.16), transparent 70%); animation: sheen 7s ease-in-out infinite alternate; }
  .hero h1 { margin: 0 0 9px; font-family: var(--f-display); font-size: 24px; font-weight: 800; letter-spacing: .04em; color: #eafcff; text-shadow: 0 0 24px rgba(40,231,255,.35); position: relative; }
  .hero h1 .accent { color: var(--cyan); }
  .hero p { margin: 0; color: var(--ink2); font-size: 13.5px; line-height: 1.6; max-width: 80%; position: relative; font-family: var(--f-mono); }
  .hero b { color: #eafcff; }
  .hero .tag { margin-top: 15px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; color: var(--cyan); display: inline-flex; align-items: center; gap: 8px; background: rgba(40,231,255,.08); border: 1px solid rgba(40,231,255,.22); padding: 6px 13px; border-radius: 22px; position: relative; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: pulse 2s infinite; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 28px; }
  .stat {
    position: relative; overflow: hidden; border-radius: 18px; padding: 20px; min-height: 104px;
    background: var(--glass2); border: 1px solid var(--line); box-shadow: 0 14px 34px rgba(0,0,0,.4); transition: transform .25s var(--ease), box-shadow .25s;
  }
  .stat:hover { transform: translateY(-4px); }
  .stat .ico { position: absolute; right: 16px; top: 16px; }
  .stat .ico svg { width: 24px; height: 24px; }
  .stat .n { font-family: var(--f-display); font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat .l { font-family: var(--f-mono); font-size: 11px; color: var(--ink2); margin-top: 10px; letter-spacing: .05em; text-transform: uppercase; }
  .stat.realizable { box-shadow: 0 0 0 1px rgba(40,231,255,.28), 0 14px 34px rgba(0,0,0,.4); }
  .stat.realizable .n, .stat.realizable .ico { color: var(--cyan); }
  .stat.partial .n, .stat.partial .ico { color: var(--amber); }
  .stat.rejected .n, .stat.rejected .ico { color: var(--muted); }
  .stat.ports .n, .stat.ports .ico { color: var(--cyan); }
  .stat::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: currentColor; opacity: .0; }

  .section-title { font-family: var(--f-display); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); margin: 4px 2px 16px; display: flex; align-items: center; gap: 10px; }
  .section-title .count { font-family: var(--f-mono); color: #02131a; background: var(--cyan); font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 20px; box-shadow: 0 0 16px rgba(40,231,255,.4); }

  .card {
    position: relative; background: var(--glass2); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px 18px 16px 20px; margin-bottom: 14px; cursor: pointer;
    display: grid; grid-template-columns: 4px 1fr auto; gap: 18px; align-items: center;
    transition: transform .22s var(--ease), box-shadow .22s, border-color .22s;
    transform-origin: right center; animation: unroll .6s var(--ease) both;
  }
  .card::before { content: ""; position: absolute; inset: 0; border-radius: 16px; padding: 1px; background: linear-gradient(120deg, transparent, rgba(40,231,255,.0)); pointer-events: none; transition: .25s; }
  .card:hover { transform: translateY(-3px); border-color: var(--line2); box-shadow: -6px 12px 34px rgba(0,0,0,.5), 0 0 22px rgba(40,231,255,.12); }
  .card.selected { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 26px rgba(40,231,255,.25); }
  .card .bar { width: 4px; height: 48px; border-radius: 4px; box-shadow: 0 0 12px currentColor; }
  .card .name { font-weight: 600; font-size: 14.5px; color: var(--ink); font-family: var(--f-mono); }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 7px; display: flex; gap: 7px; flex-wrap: wrap; align-items: center; font-family: var(--f-mono); }
  .chip { background: rgba(40,231,255,.08); color: var(--cyan); border: 1px solid rgba(40,231,255,.16); border-radius: 7px; padding: 2px 8px; font-size: 11px; }
  .chip.grey { background: rgba(120,150,160,.08); color: var(--ink2); border-color: rgba(120,150,160,.18); }
  .right { display: flex; flex-direction: column; align-items: flex-end; gap: 9px; min-width: 130px; }
  .pill { border-radius: 22px; padding: 5px 13px; font-size: 11px; font-weight: 700; font-family: var(--f-mono); letter-spacing: .04em; white-space: nowrap; color: #02131a; }
  .conf { width: 120px; height: 6px; border-radius: 6px; background: rgba(120,150,160,.16); overflow: hidden; }
  .conf > i { display: block; height: 100%; width: 0; border-radius: 6px; transition: width 1s var(--ease); box-shadow: 0 0 12px currentColor; }
  .conf-label { font-size: 10.5px; color: var(--muted); font-family: var(--f-mono); }

  .detail { background: var(--glass2); border: 1px solid var(--line); border-radius: 20px; overflow-y: auto; box-shadow: -10px 0 50px rgba(0,0,0,.45); }
  .detail-inner { padding: 28px; animation: scrollIn .5s var(--ease) both; }
  .detail .empty { color: var(--muted); text-align: center; margin-top: 110px; font-size: 13px; line-height: 1.8; padding: 0 36px; font-family: var(--f-mono); }
  .detail .empty svg { width: 50px; height: 50px; color: rgba(40,231,255,.3); margin-bottom: 16px; }
  .detail h2 { font-family: var(--f-display); font-size: 19px; margin: 0 0 14px; line-height: 1.3; font-weight: 700; color: #eafcff; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .block { border-top: 1px solid var(--line); padding: 20px 0; }
  .block:first-of-type { border-top: none; padding-top: 2px; }
  .block h3 { font-family: var(--f-display); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--cyan); margin: 0 0 16px; display: flex; align-items: center; gap: 9px; }
  .block h3::before { content: ""; width: 16px; height: 2px; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  .kv { display: flex; gap: 10px; margin-bottom: 10px; font-size: 12.5px; font-family: var(--f-mono); }
  .kv .k { color: var(--muted); min-width: 104px; }
  .kv .v { color: var(--ink); }
  .impact { background: rgba(255,59,92,.07); border: 1px solid rgba(255,59,92,.22); border-left: 3px solid var(--red); border-radius: 11px; padding: 13px 15px; font-size: 12.5px; line-height: 1.55; margin-top: 12px; color: var(--ink2); }
  .impact b { color: #ff829a; }

  .ref { background: rgba(40,231,255,.04); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 9px; transition: .2s; }
  .ref:hover { border-color: var(--line2); transform: translateX(3px); box-shadow: 0 0 18px rgba(40,231,255,.12); }
  .ref .id { font-family: var(--f-mono); font-weight: 700; font-size: 12.5px; color: var(--ink); }
  .ref .id b { color: var(--cyan); }
  .ref .cvss { float: right; font-family: var(--f-mono); font-size: 10.5px; font-weight: 700; color: #1a0008; background: linear-gradient(135deg, #ff7a6b, #ff3b5c); border-radius: 6px; padding: 2px 8px; }
  .ref .nm { font-size: 12px; color: var(--ink2); margin: 5px 0; font-weight: 600; }
  .ref .ds { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .ref-tag { font-family: var(--f-mono); font-size: 10px; font-weight: 700; letter-spacing: .12em; color: var(--muted); margin: 6px 0 8px; }

  .check { display: grid; grid-template-columns: 24px 1fr; gap: 12px; margin-bottom: 14px; font-size: 12.3px; line-height: 1.5; }
  .check .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #02131a; font-size: 12px; font-weight: 800; }
  .check .nm { font-family: var(--f-mono); font-weight: 600; color: var(--ink); }
  .check .ev { color: var(--muted); }
  .ic.pass { background: var(--cyan); box-shadow: 0 0 14px rgba(40,231,255,.55); }
  .ic.fail { background: var(--red); box-shadow: 0 0 14px rgba(255,59,92,.55); }
  .ic.warn { background: var(--amber); box-shadow: 0 0 14px rgba(255,194,77,.5); }
  .ic.na, .ic.unknown { background: var(--muted); }

  .tools { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px; }
  .tool { font-family: var(--f-mono); background: rgba(120,150,160,.1); color: var(--ink2); border: 1px solid rgba(120,150,160,.25); border-radius: 8px; padding: 4px 11px; font-size: 11px; }
  .step { margin-bottom: 16px; }
  .step .head { display: flex; align-items: center; gap: 10px; font-family: var(--f-mono); font-weight: 600; font-size: 12.5px; margin-bottom: 9px; color: var(--ink); }
  .step .num { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(140deg, #1ee6ff, #2e9bff); color: #02131a; display: grid; place-items: center; font-size: 12px; font-weight: 800; box-shadow: 0 0 14px rgba(40,231,255,.4); }
  .term { background: #030a0e; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
  .term .tbar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: rgba(40,231,255,.05); border-bottom: 1px solid var(--line); }
  .term .tbar i { width: 9px; height: 9px; border-radius: 50%; }
  .term .tbar i:nth-child(1){ background:#ff5f56; } .term .tbar i:nth-child(2){ background:#ffbd2e; } .term .tbar i:nth-child(3){ background:#27c93f; }
  .term .tbar span { margin-left: auto; font-family: var(--f-mono); font-size: 10px; color: var(--muted); letter-spacing: .1em; }
  .term pre { color: #7fe9ff; margin: 0; padding: 12px 14px; font-size: 11.6px; overflow-x: auto; font-family: var(--f-mono); line-height: 1.55; text-shadow: 0 0 8px rgba(40,231,255,.3); }
  .step .exp { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); margin-top: 8px; }
  .step .exp b { color: var(--cyan); }
  .src { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-top: 6px; }

  .main::-webkit-scrollbar, .detail::-webkit-scrollbar { width: 9px; }
  .main::-webkit-scrollbar-thumb, .detail::-webkit-scrollbar-thumb { background: rgba(40,231,255,.18); border-radius: 9px; }
  .main::-webkit-scrollbar-thumb:hover, .detail::-webkit-scrollbar-thumb:hover { background: rgba(40,231,255,.34); }

  @keyframes unroll { from { opacity: 0; transform: translateX(40px) scaleX(.6); filter: blur(2px); } to { opacity: 1; transform: translateX(0) scaleX(1); filter: blur(0); } }
  @keyframes scrollIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes sheen { from { transform: translateX(-5%); opacity: .6; } to { transform: translateX(5%); opacity: 1; } }
  @keyframes pulse { 0%{ box-shadow:0 0 0 0 rgba(40,231,255,.5);} 70%{ box-shadow:0 0 0 8px rgba(40,231,255,0);} 100%{ box-shadow:0 0 0 0 rgba(40,231,255,0);} }
  .hero, .stat { animation: fadeUp .6s var(--ease) both; }

  .card.pulse::after { content: ""; position: absolute; inset: 0; border-radius: 16px; pointer-events: none; box-shadow: 0 0 22px -3px var(--pc); opacity: 0; animation: threat var(--pd, 2.8s) ease-in-out infinite; }
  @keyframes threat { 0%, 100% { opacity: 0; } 50% { opacity: .5; } }
  #list { position: relative; }
  .scanbeam { position: absolute; left: -4px; right: -4px; top: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--cyan), transparent); box-shadow: 0 0 22px 2px rgba(40,231,255,.7); pointer-events: none; z-index: 5; animation: sweep 1.15s var(--ease) forwards; }
  @keyframes sweep { 0% { top: 0; opacity: 0; } 8% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
  .term pre.typing::after { content: "▋"; color: #7fe9ff; margin-left: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .scanshield { position: relative; width: 118px; height: 118px; margin: 0 auto 20px; }
  .detail .empty .scanshield svg { position: absolute; inset: 30px; width: 58px; height: 58px; margin: 0; color: var(--cyan); filter: drop-shadow(0 0 10px rgba(40,231,255,.6)); animation: breathe 3s ease-in-out infinite; }
  .scanshield .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(40,231,255,.16); }
  .scanshield .ring.a { border-top-color: var(--cyan); animation: spin 2.6s linear infinite; }
  .scanshield .ring.b { inset: 16px; border-bottom-color: var(--cyan); animation: spin 3.6s linear infinite reverse; }
  .scanshield .orbit { position: absolute; inset: -2px; animation: spin 4.5s linear infinite; }
  .scanshield .orbit i { position: absolute; top: -3px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { filter: drop-shadow(0 0 18px rgba(40,231,255,.9)); transform: scale(1.06); } }

  @media (prefers-reduced-motion: reduce) { *, *::after, *::before { animation: none !important; } }
</style>
</head>
<body>
<canvas id="bgfx"></canvas>
<div id="intro">
  <canvas id="introCv"></canvas>
  <button id="skip">Пропустить ▸</button>
</div>

<div class="app" id="app">
  <div class="railwrap">
    <aside class="sidebar">
      <div class="logo">RVC<span class="full">// CORRELATOR</span></div>
      <button class="nav-btn active" data-filter="all">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span class="lbl">Все находки</span>
      </button>
      <button class="nav-btn" data-filter="realizable">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
        <span class="lbl">Реализуемые</span>
      </button>
      <button class="nav-btn" data-filter="partially">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>
        <span class="lbl">Частичные</span>
      </button>
      <button class="nav-btn" data-filter="not_realizable">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
        <span class="lbl">Отклонённые</span>
      </button>
    </aside>
  </div>

  <main class="main">
    <div class="topbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="q" type="text" placeholder="Поиск по уязвимостям">
      </div>
      <button class="btn" id="refresh">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        Обновить
      </button>
    </div>
    <section class="hero" id="hero"></section>
    <div class="stats" id="stats"></div>
    <div class="section-title" id="listTitle"></div>
    <div id="list"></div>
  </main>

  <aside class="detail" id="detail">
    <div class="empty">
      <div class="scanshield">
        <span class="ring a"></span><span class="ring b"></span>
        <span class="orbit"><i></i></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/></svg>
      </div>
      <div>Выберите цель слева,<br>чтобы развернуть разбор и плейбук</div>
    </div>
  </aside>
</div>

<script>
/* ============ INTRO CINEMATIC ============ */
function playIntro() {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const overlay = document.getElementById("intro");
  if (reduce) { overlay.classList.add("hidden"); return Promise.resolve(); }

  const cv = document.getElementById("introCv");
  const ctx = cv.getContext("2d");
  let W, H, cx, cy, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function size() { W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); cx = W / 2; cy = H / 2; }
  size(); window.addEventListener("resize", size);

  const SC = window.__introScale || 1;
  const TAU = Math.PI * 2;
  const N = 12, RING = 168;
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const easeInOut = (t) => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

  const monsters = Array.from({ length: N }, (_, i) => ({
    a: (i / N) * TAU + (Math.random() - .5) * 0.22,
    spawn: 700 + Math.random() * 340, rest: RING + (Math.random() * 46 - 23),
    size: 24 + Math.random() * 17, threat: Math.random() < 0.5,
    tcount: 5 + (Math.random() * 3 | 0), tphase: Math.random() * TAU,
    eyes: Math.random() < 0.35 ? 3 : 2, wob: Math.random() * TAU, ws: 0.7 + Math.random() * 0.7,
    delay: Math.random() * 850, alive: true,
  }));
  const fog = Array.from({ length: 8 }, () => ({ x: Math.random(), y: Math.random(), r: 220 + Math.random() * 300, sp: 0.3 + Math.random() * 0.8, ph: Math.random() * TAU }));
  const cracks = Array.from({ length: 4 }, () => {
    const x0 = -40 + Math.random() * 80, pts = [[x0, -36]];
    for (let i = 0; i < 4; i++) pts.push([pts[i][0] + (Math.random() - .5) * 30, pts[i][1] + 14 + Math.random() * 8]);
    return pts;
  });
  let embers = [];

  const D = { boot: 1600 * SC, intro: 1900 * SC, assault: 1900 * SC, charge: 1450 * SC, annih: 1750 * SC, secured: 1450 * SC, fade: 750 * SC };
  const M = {};
  M.intro = D.boot; M.assault = M.intro + D.intro; M.charge = M.assault + D.assault;
  M.burst = M.charge + D.charge; M.secured = M.burst + D.annih; M.end = M.secured + D.secured;
  const total = M.end + D.fade;
  let t0 = null, done = false, raf, sx = 0, sy = 0;
  let resolver; const prom = new Promise((r) => (resolver = r));

  function finish() { if (done) return; done = true; cancelAnimationFrame(raf); overlay.classList.add("hidden"); setTimeout(resolver, 60); }
  document.getElementById("skip").addEventListener("click", finish);

  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function hexPath(R) { ctx.beginPath(); for (let i = 0; i <= 6; i++) { const a = i / 6 * TAU - Math.PI / 2; const x = Math.cos(a) * R, y = Math.sin(a) * R; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.closePath(); }

  function drawGrid(alpha, time) {
    ctx.strokeStyle = `rgba(40,231,255,${alpha})`; ctx.lineWidth = 1;
    const o = (time * 0.004) % 46;
    for (let x = ((cx % 46) - o); x < W; x += 46) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = ((cy % 46) - o); y < H; y += 46) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  }
  function drawFog(time, intensity, tint) {
    for (const f of fog) {
      const x = f.x * W + Math.sin(time * 0.00012 * f.sp * 8 + f.ph) * 90;
      const y = f.y * H + Math.cos(time * 0.0001 * f.sp * 8 + f.ph) * 70;
      const g = ctx.createRadialGradient(x, y, 0, x, y, f.r);
      g.addColorStop(0, `rgba(${tint},${0.09 * intensity})`); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  }
  function vignette(s) { const g = ctx.createRadialGradient(cx, cy * 0.92, H * 0.16, cx, cy, H * 0.92); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(0,0,0,${s})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  function scanlines(a) { ctx.fillStyle = `rgba(0,0,0,${a})`; for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1); }

  function drawComputer(time, attack, shield) {
    ctx.save(); ctx.translate(cx, cy);
    const col = shield ? "40,231,255" : attack > 0.35 ? "255,59,92" : "40,231,255";
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    const bg = ctx.createRadialGradient(0, 0, 8, 0, 0, 150);
    bg.addColorStop(0, `rgba(${col},${0.16 + 0.12 * attack + 0.06 * (shield ? 1 : 0)})`); bg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0, 0, 150, 0, TAU); ctx.fill(); ctx.restore();
    const stroke = shield ? "#28e7ff" : attack > 0.35 ? "#ff3b5c" : "#244a58";
    ctx.fillStyle = "#0b1822"; ctx.strokeStyle = stroke; ctx.lineWidth = 2;
    roundRect(-15, 38, 30, 16, 3); ctx.fill(); ctx.stroke();
    roundRect(-36, 52, 72, 8, 3); ctx.fill(); ctx.stroke();
    ctx.shadowColor = shield ? "rgba(40,231,255,.7)" : attack > 0.35 ? "rgba(255,59,92,.6)" : "rgba(40,231,255,.3)"; ctx.shadowBlur = 28;
    ctx.fillStyle = "#081119"; roundRect(-66, -48, 132, 86, 12); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
    const sc = ctx.createLinearGradient(0, -42, 0, 32);
    if (shield) { sc.addColorStop(0, "#0a3a44"); sc.addColorStop(1, "#06181f"); }
    else if (attack > 0.35) { sc.addColorStop(0, "#3c0f18"); sc.addColorStop(1, "#190608"); }
    else { sc.addColorStop(0, "#0c2832"); sc.addColorStop(1, "#06141a"); }
    ctx.fillStyle = sc; roundRect(-57, -40, 114, 70, 7); ctx.fill();
    ctx.save(); roundRect(-57, -40, 114, 70, 7); ctx.clip();
    ctx.globalAlpha = 0.14; ctx.strokeStyle = "#000"; for (let y = -40; y < 30; y += 4) { ctx.beginPath(); ctx.moveTo(-57, y); ctx.lineTo(57, y); ctx.stroke(); }
    ctx.globalAlpha = 0.05 + 0.06 * Math.random(); ctx.fillStyle = attack > 0.35 ? "#ff3b5c" : "#28e7ff"; ctx.fillRect(-57, -40, 114, 70);
    if (attack > 0.45) { ctx.globalAlpha = attack; ctx.strokeStyle = "rgba(255,130,150,.9)"; ctx.lineWidth = 1.3; ctx.shadowColor = "rgba(255,59,92,.8)"; ctx.shadowBlur = 8; for (const p of cracks) { ctx.beginPath(); p.forEach((pt, i) => i ? ctx.lineTo(pt[0], pt[1]) : ctx.moveTo(pt[0], pt[1])); ctx.stroke(); } ctx.shadowBlur = 0; }
    ctx.restore();
    ctx.fillStyle = shield ? "#8ff3ff" : attack > 0.35 ? "#ff90a2" : "#3fd0e8"; ctx.font = "800 24px 'JetBrains Mono',monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(shield ? ":)" : attack > 0.35 ? ":(" : "•_•", 0, -6);
    ctx.restore();
  }

  function drawMonster(m, emerge, rush, time) {
    const r = lerp(m.spawn, m.rest, rush);
    const bob = Math.sin(time * 0.002 * m.ws + m.wob) * 6;
    const x = cx + Math.cos(m.a) * r, y = cy + Math.sin(m.a) * r * 0.82 + bob;
    const s = m.size, col = m.threat ? "255,60,92" : "70,225,255";
    ctx.save(); ctx.translate(x, y); ctx.globalAlpha = emerge;
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    const ag = ctx.createRadialGradient(0, 0, 2, 0, 0, s * 2.3); ag.addColorStop(0, `rgba(${col},0.26)`); ag.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(0, 0, s * 2.3, 0, TAU); ctx.fill(); ctx.restore();
    ctx.strokeStyle = `rgba(${col},0.5)`; ctx.lineWidth = 2.2; ctx.lineCap = "round";
    for (let k = 0; k < m.tcount; k++) {
      const ta = (k / m.tcount) * TAU + m.tphase;
      const len = s * (1.35 + 0.5 * Math.sin(time * 0.004 + k));
      const sw = Math.sin(time * 0.005 + k * 1.3) * s * 0.6;
      ctx.beginPath(); ctx.moveTo(Math.cos(ta) * s * 0.5, Math.sin(ta) * s * 0.5);
      ctx.quadraticCurveTo(Math.cos(ta) * len - Math.sin(ta) * sw, Math.sin(ta) * len + Math.cos(ta) * sw, Math.cos(ta) * len * 1.4, Math.sin(ta) * len * 1.4);
      ctx.stroke();
    }
    ctx.shadowColor = `rgba(${col},0.8)`; ctx.shadowBlur = 18;
    const body = ctx.createRadialGradient(0, -s * 0.2, 2, 0, 0, s);
    body.addColorStop(0, "rgba(8,3,6,0.96)"); body.addColorStop(0.7, `rgba(${col},0.18)`); body.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = body; ctx.beginPath();
    const pts = 16; for (let i = 0; i <= pts; i++) { const a = i / pts * TAU; const rr = s * (0.9 + 0.13 * Math.sin(a * 3 + time * 0.004 + m.wob)); const px = Math.cos(a) * rr, py = Math.sin(a) * rr * 1.04; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
    const blink = Math.sin(time * 0.003 + m.wob) > 0.95 ? 0.18 : 1;
    for (let i = 0; i < m.eyes; i++) {
      const off = (i - (m.eyes - 1) / 2) * s * 0.36, ey = -s * 0.08;
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      const eg = ctx.createRadialGradient(off, ey, 0, off, ey, s * 0.42); eg.addColorStop(0, `rgba(${col},${0.9 * blink})`); eg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(off, ey, s * 0.42, 0, TAU); ctx.fill(); ctx.restore();
      ctx.fillStyle = `rgba(255,240,245,${blink})`; ctx.beginPath(); ctx.ellipse(off, ey, s * 0.12, s * 0.17, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgb(${col})`; ctx.beginPath(); ctx.arc(off, ey, s * 0.06, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = `rgba(${col},0.85)`; ctx.lineWidth = 1.6; ctx.beginPath();
    for (let i = 0; i <= 6; i++) { const mx = -s * 0.42 + i * (s * 0.84 / 6); ctx.lineTo(mx, s * 0.34 + (i % 2 ? -s * 0.12 : s * 0.04)); } ctx.stroke();
    ctx.restore();
    return { x, y, col };
  }

  function burstEmbers(x, y, col) {
    for (let i = 0; i < 24; i++) { const a = Math.random() * TAU, sp = 1.5 + Math.random() * 6.5; embers.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, life: 1, col, sz: 1.5 + Math.random() * 2.5 }); }
  }
  function drawEmbers() {
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    for (const p of embers) { if (p.life <= 0) continue; p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.vx *= 0.98; p.life -= 0.016;
      ctx.fillStyle = `rgba(${p.col},${p.life})`; ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.1, p.sz * p.life), 0, TAU); ctx.fill(); }
    ctx.restore(); embers = embers.filter((p) => p.life > 0);
  }
  function drawCharge(prog, time) {
    ctx.save(); ctx.translate(cx, cy); ctx.globalCompositeOperation = "lighter";
    const R0 = 230 * (1 - easeInOut(prog));
    for (let i = 0; i < 46; i++) { const a = i / 46 * TAU + time * 0.003; const rr = R0 + (i % 6) * 7; ctx.fillStyle = `rgba(40,231,255,${0.55 * prog})`; ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 1.8, 0, TAU); ctx.fill(); }
    ctx.strokeStyle = `rgba(40,231,255,${0.45 * prog})`; ctx.lineWidth = 2; ctx.shadowColor = "rgba(40,231,255,.9)"; ctx.shadowBlur = 22 * prog; hexPath(100); ctx.stroke();
    ctx.restore();
  }
  function drawShield(time, calm) {
    const R = 106 + Math.sin(time * 0.004) * 3;
    ctx.save(); ctx.translate(cx, cy); ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(0, 0, 40, 0, 0, R + 16); g.addColorStop(0, "rgba(40,231,255,0)"); g.addColorStop(0.82, `rgba(40,231,255,${0.07 + 0.04 * Math.sin(time / 200)})`); g.addColorStop(1, "rgba(40,231,255,0)");
    ctx.fillStyle = g; hexPath(R); ctx.fill();
    ctx.strokeStyle = "rgba(130,243,255,0.92)"; ctx.lineWidth = 3; ctx.shadowColor = "rgba(40,231,255,0.95)"; ctx.shadowBlur = 24; hexPath(R); ctx.stroke();
    ctx.shadowBlur = 0; ctx.strokeStyle = "rgba(40,231,255,0.22)"; ctx.lineWidth = 1; hexPath(R * 0.68); ctx.stroke(); hexPath(R * 0.4); ctx.stroke();
    const rot = time * 0.0016; ctx.strokeStyle = "rgba(190,250,255,0.9)"; ctx.lineWidth = 2.5; ctx.shadowBlur = 14; ctx.shadowColor = "rgba(40,231,255,.9)";
    for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(0, 0, R + 12, rot + k * 2.1, rot + k * 2.1 + 0.7); ctx.stroke(); }
    ctx.restore();
  }
  function drawShock(r, alpha) {
    ctx.save(); ctx.translate(cx, cy); ctx.globalCompositeOperation = "lighter";
    [["40,231,255", 0], ["54,255,176", 7], ["157,123,255", -7]].forEach(([c, off]) => { ctx.strokeStyle = `rgba(${c},${alpha})`; ctx.lineWidth = 3; ctx.shadowColor = `rgba(${c},.8)`; ctx.shadowBlur = 28; ctx.beginPath(); ctx.arc(0, 0, Math.max(0, r + off), 0, TAU); ctx.stroke(); });
    ctx.restore();
  }
  function drawArc(x2, y2, t) {
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.strokeStyle = `rgba(190,250,255,${t})`; ctx.lineWidth = 2; ctx.shadowColor = "rgba(40,231,255,.9)"; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(cx, cy); const segs = 7;
    for (let i = 1; i <= segs; i++) { const p = i / segs; const x = lerp(cx, x2, p) + (Math.random() - .5) * 20 * (1 - p); const y = lerp(cy, y2, p) + (Math.random() - .5) * 20 * (1 - p); ctx.lineTo(x, y); }
    ctx.stroke(); ctx.restore();
  }
  function titleTop(main, sub, color, glitch, big) {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `900 ${big ? 38 : 30}px 'Orbitron','JetBrains Mono',monospace`;
    const dx = (Math.random() - .5) * glitch, dy = (Math.random() - .5) * glitch, y = H * 0.16;
    ctx.fillStyle = "rgba(255,59,92,0.5)"; ctx.fillText(main, cx - 2 + dx, y + dy);
    ctx.fillStyle = "rgba(40,231,255,0.5)"; ctx.fillText(main, cx + 2 - dx, y - dy);
    ctx.shadowColor = color; ctx.shadowBlur = 20; ctx.fillStyle = color; ctx.fillText(main, cx, y); ctx.shadowBlur = 0;
    ctx.font = "600 12px 'JetBrains Mono',monospace"; ctx.fillStyle = "rgba(159,195,207,0.85)"; ctx.fillText(sub, cx, y + (big ? 34 : 28));
  }

  function render(e) {
    const time = performance.now();
    const introP = clamp01((e - M.intro) / D.intro), assaultP = clamp01((e - M.assault) / D.assault);
    const chargeP = clamp01((e - M.charge) / D.charge), sinceBurst = e - M.burst;
    const annihP = clamp01((e - M.burst) / D.annih), securedP = clamp01((e - M.secured) / D.secured);
    const fadeP = clamp01((e - M.end) / D.fade);
    const shield = e >= M.burst;

    let amp = 0;
    if (e >= M.assault && e < M.charge) amp = 2 + 5 * assaultP;
    else if (e >= M.charge && e < M.burst) amp = 4 - 2 * chargeP;
    if (sinceBurst >= 0 && sinceBurst < 420) amp = Math.max(amp, 20 * (1 - sinceBurst / 420));
    sx = (Math.random() - .5) * amp; sy = (Math.random() - .5) * amp;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#03050a"; ctx.fillRect(0, 0, W, H);
    const threat = Math.max(introP * 0.55, assaultP) * (1 - annihP * 0.85);
    const defense = Math.max(chargeP * 0.7, shield ? 0.6 + 0.4 * securedP : 0);
    const tint = `${Math.round(20 + 150 * threat)},${Math.round(30 + 60 * defense)},${Math.round(40 + 120 * defense)}`;
    const fogI = (0.55 + 0.5 * threat) * (1 - annihP * 0.55) + securedP * 0.15;
    drawGrid(0.035 + 0.04 * defense, time);
    drawFog(time, fogI, tint);

    ctx.save(); ctx.translate(sx, sy);
    const attack = e < M.burst ? clamp01(introP * 0.35 + assaultP) : 0;
    drawComputer(time, attack, shield);
    if (e >= M.charge && e < M.burst) drawCharge(chargeP, time);
    if (shield) drawShield(time, securedP);

    const shockR = sinceBurst > 0 ? easeOut(clamp01(sinceBurst / (D.annih * 0.55))) * 660 : -1;
    for (const m of monsters) {
      if (!m.alive) continue;
      const emerge = clamp01((e - M.intro - m.delay) / 650) * (sinceBurst > 0 ? 1 : 1);
      if (emerge <= 0) continue;
      const rush = e >= M.charge ? 1 : easeInOut(assaultP);
      const pos = drawMonster(m, emerge, rush, time);
      if (shockR > 0 && Math.hypot(pos.x - cx, pos.y - cy) <= shockR) { m.alive = false; burstEmbers(pos.x, pos.y, pos.col); }
    }
    if (sinceBurst >= 0 && sinceBurst < 320) for (const m of monsters) { const x = cx + Math.cos(m.a) * m.rest, y = cy + Math.sin(m.a) * m.rest * 0.82; drawArc(x, y, 1 - sinceBurst / 320); }
    if (shockR > 0) drawShock(shockR, clamp01(1 - shockR / 660));
    drawEmbers();
    ctx.restore();

    if (sinceBurst >= 0 && sinceBurst < 300) { ctx.fillStyle = `rgba(232,250,255,${0.85 * (1 - sinceBurst / 300)})`; ctx.fillRect(0, 0, W, H); }
    scanlines(0.05); vignette(0.62 + 0.22 * threat);

    if (e < M.intro) titleTop("ИНИЦИАЛИЗАЦИЯ УЗЛА", "RVC // SECURITY NODE ONLINE", "#3fd0e8", 1);
    else if (e < M.assault) titleTop("ОБНАРУЖЕНО ВТОРЖЕНИЕ", "// INCOMING THREAT", "#ff5c78", 5);
    else if (e < M.charge) titleTop("АТАКА НА УЗЕЛ", "// NODE UNDER ATTACK", "#ff3b5c", 8);
    else if (e < M.burst) titleTop("ЗАРЯД ЩИТА", "// SHIELD CHARGING", "#7ff0ff", 2);
    else if (e < M.secured) titleTop("УГРОЗА УСТРАНЕНА", "// THREATS PURGED", "#36ffb0", 2);
    else { ctx.save(); ctx.globalAlpha = easeOut(clamp01(securedP * 1.6)); titleTop("СИСТЕМА ЗАЩИЩЕНА", "RVC // NODE SECURED", "#36ffb0", 1, true); ctx.restore(); }

    if (fadeP > 0) { ctx.fillStyle = `rgba(3,5,10,${fadeP})`; ctx.fillRect(0, 0, W, H); }
  }
  function frame(now) {
    if (t0 === null) t0 = now;
    const e = now - t0;
    render(e);
    if (e >= total) { finish(); return; }
    raf = requestAnimationFrame(frame);
  }
  window.__introFreeze = () => { done = true; cancelAnimationFrame(raf); };
  window.__introRender = (e) => { cancelAnimationFrame(raf); monsters.forEach((m) => (m.alive = true)); embers = []; render(e); };
  raf = requestAnimationFrame(frame);
  return prom;
}

/* ============ DASHBOARD ============ */
const SEV = {
  CRITICAL: { c: "#ff4d61", t: "Критическая" }, HIGH: { c: "#ff4d61", t: "Высокая" },
  MEDIUM: { c: "#f5b13d", t: "Средняя" }, LOW: { c: "#28e7ff", t: "Низкая" }, UNKNOWN: { c: "#6f8a93", t: "Неизвестна" },
};
const VERDICT = {
  realizable: { c: "#28e7ff", t: "Реализуема" }, partially: { c: "#f5b13d", t: "Частично" }, not_realizable: { c: "#7d96a0", t: "Отклонена" },
};
const TYPE_RU = {
  remote_code_execution: "удалённый код", information_disclosure: "утечка данных", credential_theft: "кража учёток",
  man_in_the_middle: "перехват трафика", relay_attack: "ретрансляция", brute_force: "перебор паролей",
  authentication_bypass: "обход входа", denial_of_service: "отказ в обслуживании", misconfiguration: "небезопасная настройка",
  known_vulnerability: "известная уязвимость", reconnaissance: "разведка", os_specific: "уязвимость ОС",
};
const CHECK_NAME = { reachable: "Достижимость порта", service_enabled: "Сервис активен", version_vulnerable: "Уязвимая версия/продукт", no_mitigation: "Компенсирующие контроли" };
const CHECK_ICON = { pass: "✓", fail: "✕", warn: "!", na: "–", unknown: "?" };

let STATE = { report: null, filter: "all", q: "", selected: null, items: [] };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const sev = (s) => SEV[s] || SEV.UNKNOWN;

function ingest(r) {
  STATE.report = r;
  STATE.items = [...r.realizable_vulnerabilities, ...r.partially_realizable, ...r.rejected].map((f, i) => ({ ...f, _id: i }));
  renderHero(); renderStats(); renderNavCounts(); renderList(); runScan();
}
function runScan() {
  const list = document.getElementById("list"); if (!list) return;
  const beam = document.createElement("div"); beam.className = "scanbeam";
  beam.addEventListener("animationend", () => beam.remove());
  list.appendChild(beam);
}
function typeTerminals() {
  document.querySelectorAll("#detail .term pre").forEach((pre, idx) => {
    const full = pre.textContent; pre.textContent = ""; pre.classList.add("typing");
    let i = 0;
    setTimeout(() => { const tick = () => { i += 2; pre.textContent = full.slice(0, i); if (i < full.length) requestAnimationFrame(tick); else pre.classList.remove("typing"); }; tick(); }, idx * 240);
  });
}
async function loadData(refresh) {
  const res = await fetch("/api/report" + (refresh ? "?refresh=1" : ""));
  return res.json();
}

function renderHero() {
  const m = STATE.report.meta;
  document.getElementById("hero").innerHTML = `
    <h1>УЗЕЛ <span class="accent">${esc(m.target.hostname || m.target.ip || "—")}</span></h1>
    <p>${esc(m.target.os)} · реализуемых уязвимостей: <b>${m.counts.realizable}</b> из ${m.counts.attack_vectors} векторов · достижимо портов снаружи: <b>${m.reachable_ports.length}</b></p>
    <div class="tag"><span class="dot"></span> Источник: базы MITRE · отбор без ИИ</div>`;
}
function countUp(el, to) { const s = performance.now(); const tick = (n) => { const p = Math.min(1, (n - s) / 700); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
function renderStats() {
  const c = STATE.report.meta.counts, ports = STATE.report.meta.reachable_ports.length;
  const ic = {
    realizable: '<path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/>',
    partial: '<circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/>', rejected: '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',
    ports: '<rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  };
  const cards = [
    { cls: "realizable", n: c.realizable, l: "Реализуемые", k: "realizable" }, { cls: "partial", n: c.partially, l: "Частично", k: "partial" },
    { cls: "rejected", n: c.not_realizable, l: "Отклонённые", k: "rejected" }, { cls: "ports", n: ports, l: "Портов снаружи", k: "ports" },
  ];
  document.getElementById("stats").innerHTML = cards.map((s, i) => `
    <div class="stat ${s.cls}" style="animation-delay:${i * 80}ms">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ic[s.k]}</svg></span>
      <div class="n" data-to="${s.n}">0</div><div class="l">${s.l}</div></div>`).join("");
  document.querySelectorAll(".stat .n").forEach((el) => countUp(el, +el.dataset.to));
}
function renderNavCounts() {
  const c = STATE.report.meta.counts;
  const map = { all: c.realizable + c.partially + c.not_realizable, realizable: c.realizable, partially: c.partially, not_realizable: c.not_realizable };
  document.querySelectorAll(".nav-btn").forEach((b) => {
    const k = b.dataset.filter; if (b.querySelector(".cnt")) b.querySelector(".cnt").remove();
    const s = document.createElement("span"); s.className = "cnt lbl"; s.textContent = map[k]; b.appendChild(s);
  });
}
function visibleItems() {
  const q = STATE.q.toLowerCase();
  return STATE.items.filter((f) => {
    if (STATE.filter !== "all" && f.verdict !== STATE.filter) return false;
    if (!q) return true;
    return (f.attack_name + " " + f.port + " " + (f.references.cve || []).map((c) => c.id).join(" ")).toLowerCase().includes(q);
  });
}
function renderList() {
  const items = visibleItems();
  const labels = { all: "Все находки", realizable: "Реализуемые", partially: "Частично реализуемые", not_realizable: "Отклонённые" };
  document.getElementById("listTitle").innerHTML = `${labels[STATE.filter]} <span class="count">${items.length}</span>`;
  document.getElementById("list").innerHTML = items.map((f, i) => {
    const v = VERDICT[f.verdict], cve = (f.references.cve || []).map((c) => c.id).join(", ");
    return `<div class="card ${STATE.selected === f._id ? "selected" : ""} ${f.verdict !== "not_realizable" ? "pulse" : ""}" data-id="${f._id}" style="animation-delay:${Math.min(i * 45, 500)}ms; --pc:${sev(f.severity).c}; --pd:${(2.2 + (i % 5) * 0.3).toFixed(2)}s">
      <div class="bar" style="background:${sev(f.severity).c};color:${sev(f.severity).c}"></div>
      <div><div class="name">${esc(f.attack_name)}</div><div class="meta">
        ${f.port ? `<span class="chip">порт ${f.port}</span>` : ""}${TYPE_RU[f.attack_type] ? `<span class="chip grey">${TYPE_RU[f.attack_type]}</span>` : ""}${cve ? `<span class="chip grey">${esc(cve)}</span>` : ""}
      </div></div>
      <div class="right"><span class="pill" style="background:${v.c}">${v.t}</span>
        <div class="conf"><i data-w="${Math.round(f.confidence * 100)}" style="background:${v.c};color:${v.c}"></i></div>
        <span class="conf-label">${Math.round(f.confidence * 100)}%</span></div></div>`;
  }).join("") || `<div style="color:var(--muted);padding:24px;font-family:var(--f-mono)">Ничего не найдено</div>`;
  requestAnimationFrame(() => document.querySelectorAll(".conf > i").forEach((el) => { el.style.width = el.dataset.w + "%"; }));
  document.querySelectorAll(".card").forEach((el) => el.addEventListener("click", () => { STATE.selected = +el.dataset.id; renderList(); renderDetail(); }));
}
function refBlock(title, arr, render) { if (!arr || !arr.length) return ""; return `<div class="ref-group"><div class="ref-tag">${title}</div>${arr.map(render).join("")}</div>`; }
function renderDetail() {
  const f = STATE.items.find((x) => x._id === STATE.selected); if (!f) return;
  const s = sev(f.severity), v = VERDICT[f.verdict], ts = f.target_software, r = f.references, p = f.playbook;
  const refs = `
    ${refBlock("CVE", r.cve, (c) => `<div class="ref"><div class="id">${c.cvss != null ? `<span class="cvss">CVSS ${c.cvss}</span>` : ""}<b>${esc(c.id)}</b></div>${c.name ? `<div class="nm">${esc(c.name)}</div>` : ""}<div class="ds">${esc(c.description)}</div></div>`)}
    ${refBlock("CWE", r.cwe, (c) => `<div class="ref"><div class="id"><b>${esc(c.id)}</b> ${esc(c.name)}</div><div class="ds">${esc(c.description)}</div></div>`)}
    ${refBlock("CAPEC", r.capec, (c) => `<div class="ref"><div class="id"><b>${esc(c.id)}</b> ${esc(c.name)}</div><div class="ds">${esc(c.description)}</div></div>`)}
    ${refBlock("MITRE ATT&CK", r.attack, (c) => `<div class="ref"><div class="id"><b>${esc(c.id)}</b> ${esc(c.name)} · <i>${esc(c.tactic)}</i></div><div class="ds">${esc(c.description)}</div></div>`)}`;
  const trace = f.trace.map((t) => `<div class="check"><div class="ic ${t.status}">${CHECK_ICON[t.status] || "·"}</div><div><span class="nm">${CHECK_NAME[t.name] || t.name}</span><br><span class="ev">${esc(t.evidence)}</span></div></div>`).join("");
  const steps = (p.steps || []).map((st) => `<div class="step"><div class="head"><span class="num">${st.n}</span> ${esc(st.action)}</div><div class="term"><div class="tbar"><i></i><i></i><i></i><span>консоль</span></div><pre>${esc(st.command)}</pre></div><div class="exp">Ожидаемо: <b>${esc(st.expected_result)}</b></div></div>`).join("");
  document.getElementById("detail").innerHTML = `<div class="detail-inner">
    <h2>${esc(f.attack_name)}</h2>
    <div class="badges"><span class="pill" style="background:${v.c}">${v.t}</span><span class="pill" style="background:${s.c}">${s.t}</span><span class="pill" style="background:#28e7ff">уверенность ${Math.round(f.confidence * 100)}%</span></div>
    <div class="block"><h3>Атакуемое ПО</h3>
      <div class="kv"><div class="k">Продукт</div><div class="v">${esc(ts.product)}</div></div>
      ${ts.version_observed ? `<div class="kv"><div class="k">Версия</div><div class="v">${esc(ts.version_observed)}</div></div>` : ""}
      <div class="kv"><div class="k">Компонент</div><div class="v">${esc(ts.system_component)}</div></div>
      ${f.port ? `<div class="kv"><div class="k">Порт</div><div class="v">:${f.port}</div></div>` : ""}
      <div class="impact"><b>Что произойдёт:</b> ${esc(ts.impact_if_exploited)}</div></div>
    <div class="block"><h3>Почему такой вердикт</h3>${trace}</div>
    ${refs.trim() ? `<div class="block"><h3>Связанные записи MITRE</h3>${refs}</div>` : ""}
    <div class="block"><h3>Как воспроизвести</h3><div class="tools">${(p.tools || []).map((t) => `<span class="tool">${esc(t)}</span>`).join("")}</div>${steps}<div class="src">Источник сценария: ${esc(p.source)}</div></div>
  </div>`;
  document.getElementById("detail").scrollTop = 0;
  typeTerminals();
}

document.querySelectorAll(".nav-btn").forEach((b) => b.addEventListener("click", () => { document.querySelectorAll(".nav-btn").forEach((x) => x.classList.remove("active")); b.classList.add("active"); STATE.filter = b.dataset.filter; renderList(); }));
document.getElementById("q").addEventListener("input", (e) => { STATE.q = e.target.value; renderList(); });
document.getElementById("refresh").addEventListener("click", async (e) => { e.currentTarget.disabled = true; ingest(await loadData(true)); e.currentTarget.disabled = false; });

/* ============ AMBIENT BACKGROUND (шестерёнки + бегущие ПК) ============ */
(function startBgFx() {
  const cv = document.getElementById("bgfx"), ctx = cv.getContext("2d");
  let W, H, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function size() { W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  size(); window.addEventListener("resize", size);
  const TAU = Math.PI * 2;
  const lerp = (a, b, t) => a + (b - a) * t;
  const gears = [
    { x: 0.13, y: 0.18, r: 130, teeth: 15, sp: 0.05 },
    { x: 0.20, y: 0.30, r: 76, teeth: 11, sp: -0.09 },
    { x: 0.90, y: 0.80, r: 158, teeth: 17, sp: -0.045 },
    { x: 0.815, y: 0.90, r: 86, teeth: 12, sp: 0.08 },
  ];
  const bots = Array.from({ length: 6 }, (_, i) => ({ x: i / 6 + Math.random() * 0.1, y: 0.62 + Math.random() * 0.3, sp: 0.012 + Math.random() * 0.016, sz: 13 + Math.random() * 9, ph: Math.random() * TAU }));
  const traces = Array.from({ length: 9 }, () => {
    const pts = []; let x = -0.04, y = 0.08 + Math.random() * 0.84; pts.push([x, y]);
    const segs = 3 + (Math.random() * 3 | 0);
    for (let s = 0; s < segs; s++) { x += 0.1 + Math.random() * 0.16; pts.push([x, y]); y = Math.max(0.05, Math.min(0.95, y + (Math.random() - 0.5) * 0.22)); pts.push([x, y]); }
    pts.push([1.06, y]);
    return { pts, pulses: Array.from({ length: 1 + (Math.random() * 2 | 0) }, () => ({ t: Math.random(), sp: 0.05 + Math.random() * 0.06 })) };
  });
  function pointAlong(P, t) {
    let total = 0; const seg = [];
    for (let i = 1; i < P.length; i++) { const d = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); seg.push(d); total += d; }
    let dist = t * total;
    for (let i = 1; i < P.length; i++) { if (dist <= seg[i - 1]) { const f = dist / (seg[i - 1] || 1); return [lerp(P[i - 1][0], P[i][0], f), lerp(P[i - 1][1], P[i][1], f)]; } dist -= seg[i - 1]; }
    return P[P.length - 1];
  }
  function drawTraces() {
    for (const tr of traces) {
      const P = tr.pts.map((p) => [p[0] * W, p[1] * H]);
      ctx.strokeStyle = "rgba(40,231,255,0.06)"; ctx.lineWidth = 1;
      ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
      ctx.fillStyle = "rgba(40,231,255,0.12)";
      for (const p of P) ctx.fillRect(p[0] - 1.5, p[1] - 1.5, 3, 3);
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      for (const pu of tr.pulses) { pu.t = (pu.t + pu.sp * 0.05) % 1; const pos = pointAlong(P, pu.t);
        ctx.fillStyle = "rgba(130,240,255,0.95)"; ctx.shadowColor = "rgba(40,231,255,0.9)"; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(pos[0], pos[1], 2.2, 0, TAU); ctx.fill(); }
      ctx.restore();
    }
  }

  function gear(g, t) {
    ctx.save(); ctx.translate(g.x * W, g.y * H); ctx.rotate(t * g.sp * 0.0006);
    ctx.strokeStyle = "rgba(40,231,255,0.14)"; ctx.fillStyle = "rgba(40,231,255,0.045)"; ctx.lineWidth = 2;
    const r = g.r, tr = r * 1.15, n = g.teeth;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a0 = i / n * TAU, a1 = (i + 0.5) / n * TAU;
      ctx.lineTo(Math.cos(a0) * r, Math.sin(a0) * r);
      ctx.lineTo(Math.cos(a0 + 0.07) * tr, Math.sin(a0 + 0.07) * tr);
      ctx.lineTo(Math.cos(a1 - 0.07) * tr, Math.sin(a1 - 0.07) * tr);
      ctx.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.42, 0, TAU); ctx.stroke();
    for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.18, Math.sin(a) * r * 0.18); ctx.lineTo(Math.cos(a) * r * 0.4, Math.sin(a) * r * 0.4); ctx.stroke(); }
    ctx.restore();
  }
  function bot(b, t) {
    const x = (((b.x + t * 0.00002 * b.sp * 50) % 1.12) - 0.06) * W, y = b.y * H + Math.sin(t * 0.006 + b.ph) * 2, s = b.sz;
    ctx.save(); ctx.translate(x, y);
    ctx.strokeStyle = "rgba(40,231,255,0.2)"; ctx.lineWidth = 1.5;
    ctx.strokeRect(-s * 0.6, -s * 0.55, s * 1.2, s * 0.85);
    ctx.fillStyle = "rgba(40,231,255,0.16)"; ctx.fillRect(-s * 0.46, -s * 0.42, s * 0.92, s * 0.58);
    ctx.beginPath(); ctx.moveTo(0, s * 0.3); ctx.lineTo(0, s * 0.46); ctx.stroke();
    const leg = Math.sin(t * 0.012 + b.ph) * s * 0.28;
    ctx.beginPath(); ctx.moveTo(-s * 0.18, s * 0.46); ctx.lineTo(-s * 0.18 + leg, s * 0.74); ctx.moveTo(s * 0.18, s * 0.46); ctx.lineTo(s * 0.18 - leg, s * 0.74); ctx.stroke();
    ctx.restore();
  }
  function loop() {
    const t = performance.now();
    ctx.clearRect(0, 0, W, H);
    drawTraces();
    for (const g of gears) gear(g, t);
    for (const b of bots) bot(b, t);
    requestAnimationFrame(loop);
  }
  loop();
})();

(async function boot() {
  const [report] = await Promise.all([loadData(false), playIntro()]);
  document.getElementById("app").classList.add("ready");
  ingest(report);
})();
</script>
