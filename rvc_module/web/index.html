<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RVC // Реализуемость уязвимостей — по позициям атакующего</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#04060a; --bg1:#070b12; --panel:rgba(11,19,29,.72); --panel2:rgba(14,24,36,.85);
    --line:rgba(64,224,255,.14); --line2:rgba(64,224,255,.30);
    --cyan:#28e7ff; --ink:#dceaf1; --ink2:#9fc0cc; --muted:#6c8794;
    --green:#36ffb0; --amber:#ffc24d; --red:#ff3b5c;
    --sev-critical:#ff3b5c; --sev-high:#ff7a6b; --sev-medium:#ffc24d; --sev-low:#36ffb0; --sev-unknown:#6f8a93;
    --f-display:"Orbitron",monospace; --f-mono:"JetBrains Mono",monospace; --f-body:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  #bgfx{position:fixed;inset:0;z-index:0;pointer-events:none}
  body::after{content:"";position:fixed;inset:-10%;z-index:0;pointer-events:none;
    background:radial-gradient(600px 430px at 28% 26%,rgba(40,231,255,.09),transparent 60%),
               radial-gradient(720px 520px at 74% 72%,rgba(157,123,255,.07),transparent 62%),
               radial-gradient(520px 380px at 60% 12%,rgba(54,255,176,.05),transparent 60%);
    animation:nebula 26s ease-in-out infinite alternate}
  @keyframes nebula{from{transform:translate3d(-2.5%,-1.8%,0) scale(1)}to{transform:translate3d(2.5%,1.8%,0) scale(1.12)}}
  #app{position:relative;z-index:1}
  @keyframes cardIn{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}
  @keyframes detailIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .card{animation:cardIn .34s cubic-bezier(.2,.7,.25,1) both}
  .detail.anim{animation:detailIn .3s ease both}
  body{
    font-family:var(--f-body); color:var(--ink); font-size:14px; overflow:hidden;
    background:
      radial-gradient(1200px 700px at 82% -8%,rgba(40,231,255,.10),transparent 55%),
      radial-gradient(900px 600px at -8% 110%,rgba(40,231,255,.07),transparent 52%), var(--bg0);
  }
  a{color:var(--cyan)}
  .mono{font-family:var(--f-mono)}
  /* ---------- layout ---------- */
  #app{display:flex;flex-direction:column;height:100vh}
  header.bar{display:flex;align-items:center;gap:16px;min-height:58px;padding:9px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(10,18,27,.92),rgba(7,12,18,.74));backdrop-filter:blur(8px);z-index:5;flex:none}
  .brand{display:flex;flex-direction:column;justify-content:center;line-height:1.12}
  .brand b{font-family:var(--f-display);font-weight:800;letter-spacing:2.5px;font-size:19px;color:var(--cyan)}
  .brand small{font-family:var(--f-body);font-weight:500;letter-spacing:.2px;color:var(--muted);font-size:10px;margin-top:3px;white-space:nowrap}
  .target{font-family:var(--f-mono);font-size:11.5px;color:var(--ink2);border-left:1px solid var(--line);padding-left:16px;white-space:nowrap}
  .target b{color:var(--ink)}
  .spacer{flex:1}
  .tabs{display:flex;gap:6px;background:rgba(0,0,0,.25);padding:4px;border-radius:12px;border:1px solid var(--line)}
  .tab{padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--ink2);border:1px solid transparent;white-space:nowrap;transition:.15s}
  .tab .grp{display:block;font-size:9.5px;font-weight:500;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
  .tab:hover{color:var(--ink)}
  .tab.active{background:rgba(40,231,255,.12);border-color:var(--line2);color:var(--ink)}
  .btn{padding:8px 13px;border-radius:9px;border:1px solid var(--line2);background:rgba(40,231,255,.08);color:var(--cyan);
    cursor:pointer;font-weight:600;font-size:12.5px;font-family:var(--f-body)}
  .btn:hover{background:rgba(40,231,255,.16)}

  .sub{display:flex;align-items:center;gap:16px;padding:9px 22px;border-bottom:1px solid var(--line);background:rgba(6,10,16,.5)}
  .pos-desc{font-size:11.5px;color:var(--ink2);flex:1 1 auto;min-width:260px;line-height:1.4}
  .pos-desc b{color:var(--cyan)}
  .counts{display:flex;gap:8px;flex:none}
  .cnt{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.22);font-weight:700;font-size:13px}
  .cnt .dot{width:8px;height:8px;border-radius:50%}
  .cnt .lab{font-weight:500;color:var(--ink2);font-size:11px}
  .cnt.green{border-color:rgba(54,255,176,.35)} .cnt.green .dot{background:var(--green)}
  .cnt.amber{border-color:rgba(255,194,77,.35)} .cnt.amber .dot{background:var(--amber)}
  .cnt.red{border-color:rgba(255,59,92,.35)} .cnt.red .dot{background:var(--red)}
  .ports{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);flex:none;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .main{display:flex;flex:1;min-height:0}
  .list{width:42%;min-width:380px;max-width:600px;overflow:auto;padding:12px 12px 28px;border-right:1px solid var(--line)}
  .detail{flex:1;overflow:auto;padding:18px 24px 40px}

  .filterline{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap;position:sticky;top:-12px;padding-top:2px;background:linear-gradient(180deg,var(--bg0) 70%,transparent);z-index:2}
  .chip{padding:4px 11px;border-radius:7px;border:1px solid var(--line);background:rgba(0,0,0,.2);cursor:pointer;font-size:11.5px;color:var(--ink2)}
  .chip:hover{color:var(--ink)}
  .chip.active{border-color:var(--line2);color:var(--ink);background:rgba(40,231,255,.1)}

  /* ---------- finding card ---------- */
  .card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:.12s;position:relative}
  .card:hover{border-color:var(--line2);background:var(--panel2)}
  .card.sel{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(40,231,255,.35)}
  .card .row1{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .card .nm{font-weight:600;font-size:12.5px;flex:1;line-height:1.25;color:var(--ink)}
  .sevtag{font-size:8.5px;font-weight:800;letter-spacing:.4px;padding:2px 6px;border-radius:5px;color:#04060a;flex:none}
  .porttag{font-family:var(--f-mono);font-size:10px;color:var(--muted);border:1px solid var(--line);padding:0 5px;border-radius:5px;flex:none}
  .badges{display:flex;gap:5px}
  .badge{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 4px;border-radius:7px;border:1px solid var(--line);background:rgba(0,0,0,.22);cursor:help}
  .badge .bgrp{font-size:8px;letter-spacing:.3px;text-transform:uppercase;color:var(--muted)}
  .badge .bword{font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:5px;white-space:nowrap}
  .badge .bword::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .badge.green .bword{color:var(--green)} .badge.green{border-color:rgba(54,255,176,.3)}
  .badge.amber .bword{color:var(--amber)} .badge.amber{border-color:rgba(255,194,77,.3)}
  .badge.red .bword{color:var(--red)} .badge.red{border-color:rgba(255,59,92,.3)}
  .badge.emph{background:rgba(40,231,255,.07);box-shadow:0 0 0 1px var(--line2) inset}

  /* ---------- tooltip (numeric breakdown on hover) ---------- */
  .tip{position:fixed;z-index:50;max-width:380px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;
    padding:12px 14px;box-shadow:0 24px 60px -20px #000;display:none;pointer-events:none}
  .tip h5{margin:0 0 4px;font-size:12.5px;color:var(--ink)}
  .tip .score{font-family:var(--f-mono);font-weight:700;font-size:13px;margin-bottom:8px}
  .tip .thr{font-size:10.5px;color:var(--muted);margin-bottom:8px}
  .tip .fline{display:flex;gap:8px;font-size:11px;padding:3px 0;border-top:1px dashed rgba(255,255,255,.06);line-height:1.35}
  .tip .fd{font-family:var(--f-mono);font-weight:700;min-width:34px;text-align:right}
  .tip .pos{color:var(--green)} .tip .neg{color:var(--red)} .tip .zero{color:var(--muted)}
  .tip .gate{color:var(--red);font-size:11px;margin-top:6px;font-weight:600}

  /* ---------- detail ---------- */
  .empty{color:var(--muted);text-align:center;margin-top:80px;font-size:13px}
  .d-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
  .d-title{font-family:var(--f-display);font-weight:600;font-size:20px;color:var(--ink);line-height:1.2}
  .d-sub{color:var(--ink2);font-size:12.5px;margin-bottom:16px}
  .d-sub .mono{color:var(--cyan)}
  .sec{border:1px solid var(--line);background:var(--panel);border-radius:13px;padding:16px;margin-bottom:14px}
  .sec h3{margin:0 0 12px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--cyan);font-weight:700}
  .sec h3 .hint{float:right;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:500;font-size:10.5px}
  .basis{float:right;text-transform:none;letter-spacing:0;font-weight:600;font-size:10px;padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
  .basis.product{color:var(--green);border-color:rgba(54,255,176,.35);background:rgba(54,255,176,.06)}
  .basis.type{color:var(--amber);border-color:rgba(255,194,77,.35);background:rgba(255,194,77,.06)}
  .basis.generic{color:var(--ink2);background:rgba(255,255,255,.03)}
  /* сворачиваемые секции (минимализм по умолчанию) */
  details.sec{padding:0}
  details.sec>summary{list-style:none;cursor:pointer;padding:13px 16px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--cyan);font-weight:700;display:flex;align-items:center;gap:9px}
  details.sec>summary::-webkit-details-marker{display:none}
  details.sec>summary::before{content:"▸";color:var(--muted);font-size:11px;transition:.15s}
  details.sec[open]>summary::before{transform:rotate(90deg)}
  details.sec>summary:hover{color:var(--ink)}
  details.sec>.body{padding:0 16px 16px}
  details.sec>summary .basis{margin-left:auto}
  /* ведущая строка «суть» */
  .gist{font-size:13px;color:var(--ink);background:rgba(40,231,255,.05);border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin-bottom:14px;line-height:1.45}
  .gist b{color:var(--cyan)}
  /* строка «что уточнить» / блокер */
  .verify{font-size:10.5px;color:var(--amber);background:rgba(255,194,77,.07);border:1px solid rgba(255,194,77,.25);border-radius:7px;padding:5px 7px;margin:7px 0 0;line-height:1.4}
  .verify.gate{color:var(--red);background:rgba(255,59,92,.07);border-color:rgba(255,59,92,.25)}

  .assess{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .assess.two{grid-template-columns:1fr 1fr}
  .adminup{font-size:10.5px;color:var(--ink2);background:rgba(40,231,255,.06);border:1px solid var(--line);border-radius:7px;padding:5px 8px;margin-top:7px;line-height:1.4}
  .adminup b.green{color:var(--green)} .adminup b.amber{color:var(--amber)} .adminup b.red{color:var(--red)}
  .acol{border:1px solid var(--line);border-radius:11px;padding:11px;background:rgba(0,0,0,.2)}
  .acol .agrp{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
  .acol .alab{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:7px}
  .verd{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:14px;margin-bottom:7px}
  .verd .dot{width:11px;height:11px;border-radius:50%}
  .verd.green{color:var(--green)} .verd.green .dot{background:var(--green)}
  .verd.amber{color:var(--amber)} .verd.amber .dot{background:var(--amber)}
  .verd.red{color:var(--red)} .verd.red .dot{background:var(--red)}
  .bar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0}
  .bar i{display:block;height:100%}
  .bar i.green{background:var(--green)} .bar i.amber{background:var(--amber)} .bar i.red{background:var(--red)}
  .just{font-size:11.5px;color:var(--ink2);line-height:1.45}
  .factbtn{margin-top:8px;font-size:10.5px;color:var(--cyan);cursor:pointer;user-select:none}
  .facts{margin-top:8px;display:none}
  .facts.open{display:block}
  .facts .fline{display:flex;gap:8px;font-size:10.5px;padding:3px 0;border-top:1px dashed rgba(255,255,255,.06);line-height:1.35}
  .facts .fd{font-family:var(--f-mono);font-weight:700;min-width:30px;text-align:right}
  .facts .pos{color:var(--green)} .facts .neg{color:var(--red)} .facts .zero{color:var(--muted)}

  .kv{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;font-size:12.5px}
  .kv .k{color:var(--muted)} .kv .v{color:var(--ink)}
  .reflist{display:flex;flex-wrap:wrap;gap:6px}
  .ref{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:7px;padding:3px 8px;color:var(--ink2)}
  .ref b{color:var(--cyan)}

  /* methodic */
  .phase{border-left:2px solid var(--line2);padding:2px 0 2px 14px;margin:0 0 16px}
  .phase .pname{font-weight:700;color:var(--ink);font-size:13px}
  .phase .pgoal{font-size:11px;color:var(--muted);margin-bottom:9px}
  .step{margin-bottom:11px}
  .step .act{font-weight:600;font-size:12.5px;color:var(--ink)}
  .cmd{position:relative;font-family:var(--f-mono);font-size:11.5px;color:#bfe;background:rgba(0,0,0,.4);border:1px solid var(--line);
    border-radius:8px;padding:8px 38px 8px 10px;margin:5px 0;white-space:pre-wrap;word-break:break-word}
  .cmd .cp{position:absolute;right:6px;top:6px;font-size:10px;color:var(--muted);cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:2px 6px}
  .cmd .cp:hover{color:var(--cyan)}
  .exp{font-size:11px;color:var(--green)} .exp b{color:var(--ink2);font-weight:600}
  .why{font-size:11px;color:var(--ink2);margin-top:3px;line-height:1.4} .why b{color:var(--muted)}
  ul.tight{margin:6px 0;padding-left:18px;font-size:12px;line-height:1.5;color:var(--ink2)}
  ul.tight li{margin-bottom:3px}
  .toolrow{display:flex;flex-wrap:wrap;gap:8px}
  .tool{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:11px;background:rgba(0,0,0,.2)}
  .tool b{color:var(--cyan);font-family:var(--f-mono)} .tool .pp{color:var(--ink2)} .tool .ins{color:var(--muted);font-family:var(--f-mono)}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .def h4{margin:0 0 6px;font-size:11.5px;color:var(--ink);text-transform:uppercase;letter-spacing:.5px}
  .warn{font-size:10.5px;color:var(--amber);border:1px solid rgba(255,194,77,.3);border-radius:8px;padding:7px 10px;margin-bottom:14px;background:rgba(255,194,77,.06)}
  @media(max-width:1100px){.assess{grid-template-columns:1fr}.twocol{grid-template-columns:1fr}.list{width:50%}}
  /* ===== intro-анимация (заставка перед окном, не трогаем чужую логику) ===== */
  #intro { position: fixed; inset: 0; z-index: 1000; background: radial-gradient(circle at 50% 45%, #0a1018, #03050a 75%); transition: opacity .8s ease, visibility .8s; }
  #intro.hidden { opacity: 0; visibility: hidden; }
  #introCv { width: 100%; height: 100%; display: block; }
  #skip {
    position: absolute; bottom: 26px; right: 30px; z-index: 1001; cursor: pointer;
    font-family: var(--f-mono); font-size: 12px; letter-spacing: .15em; color: var(--ink2);
    background: rgba(40,231,255,.06); border: 1px solid var(--line2); border-radius: 30px; padding: 9px 18px;
    transition: .2s; text-transform: uppercase;
  }
  #skip:hover { color: #fff; background: rgba(40,231,255,.16); box-shadow: 0 0 22px rgba(40,231,255,.35); }
</style>
</head>
<body>
<canvas id="bgfx"></canvas>
<div id="intro">
  <canvas id="introCv"></canvas>
  <button id="skip">Пропустить ▸</button>
</div>
<div id="app">
  <header class="bar">
    <div class="brand"><b>RVC</b><small>Realizable Vulnerability Correlator</small></div>
    <div class="target" id="target">—</div>
    <div class="spacer"></div>
    <div class="tabs" id="tabs"></div>
    <button class="btn" id="refresh">⟳ Обновить</button>
  </header>
  <div class="sub">
    <div class="pos-desc" id="posdesc"></div>
    <div class="counts" id="counts"></div>
    <div class="ports" id="ports"></div>
  </div>
  <div class="main">
    <div class="list">
      <div class="filterline" id="filters"></div>
      <div id="cards"></div>
    </div>
    <div class="detail" id="detail"><div class="empty">Выберите атаку слева, чтобы увидеть оценку по позициям и методички.</div></div>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
/* ============ INTRO CINEMATIC ============ */
function playIntro() {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const overlay = document.getElementById("intro");
  if (reduce) { overlay.classList.add("hidden"); return Promise.resolve(); }

  const cv = document.getElementById("introCv");
  const ctx = cv.getContext("2d");
  let W, H, cx, cy, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function size() { W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); cx = W / 2; cy = H / 2; }
  size(); window.addEventListener("resize", size);

  const SC = window.__introScale || 1;
  const TAU = Math.PI * 2;
  const N = 12, RING = 168;
  const clamp01 = (v) => Math.max(0, Math.min(1, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const easeInOut = (t) => (t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

  const monsters = Array.from({ length: N }, (_, i) => ({
    a: (i / N) * TAU + (Math.random() - .5) * 0.22,
    spawn: 700 + Math.random() * 340, rest: RING + (Math.random() * 46 - 23),
    size: 24 + Math.random() * 17, threat: Math.random() < 0.5,
    tcount: 5 + (Math.random() * 3 | 0), tphase: Math.random() * TAU,
    eyes: Math.random() < 0.35 ? 3 : 2, wob: Math.random() * TAU, ws: 0.7 + Math.random() * 0.7,
    delay: Math.random() * 850, alive: true,
  }));
  const fog = Array.from({ length: 8 }, () => ({ x: Math.random(), y: Math.random(), r: 220 + Math.random() * 300, sp: 0.3 + Math.random() * 0.8, ph: Math.random() * TAU }));
  const cracks = Array.from({ length: 4 }, () => {
    const x0 = -40 + Math.random() * 80, pts = [[x0, -36]];
    for (let i = 0; i < 4; i++) pts.push([pts[i][0] + (Math.random() - .5) * 30, pts[i][1] + 14 + Math.random() * 8]);
    return pts;
  });
  let embers = [];

  const D = { boot: 1600 * SC, intro: 1900 * SC, assault: 1900 * SC, charge: 1450 * SC, annih: 1750 * SC, secured: 1450 * SC, fade: 750 * SC };
  const M = {};
  M.intro = D.boot; M.assault = M.intro + D.intro; M.charge = M.assault + D.assault;
  M.burst = M.charge + D.charge; M.secured = M.burst + D.annih; M.end = M.secured + D.secured;
  const total = M.end + D.fade;
  let t0 = null, done = false, raf, sx = 0, sy = 0;
  let resolver; const prom = new Promise((r) => (resolver = r));

  function finish() { if (done) return; done = true; cancelAnimationFrame(raf); overlay.classList.add("hidden"); setTimeout(resolver, 60); }
  document.getElementById("skip").addEventListener("click", finish);

  function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function hexPath(R) { ctx.beginPath(); for (let i = 0; i <= 6; i++) { const a = i / 6 * TAU - Math.PI / 2; const x = Math.cos(a) * R, y = Math.sin(a) * R; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.closePath(); }

  function drawGrid(alpha, time) {
    ctx.strokeStyle = `rgba(40,231,255,${alpha})`; ctx.lineWidth = 1;
    const o = (time * 0.004) % 46;
    for (let x = ((cx % 46) - o); x < W; x += 46) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = ((cy % 46) - o); y < H; y += 46) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  }
  function drawFog(time, intensity, tint) {
    for (const f of fog) {
      const x = f.x * W + Math.sin(time * 0.00012 * f.sp * 8 + f.ph) * 90;
      const y = f.y * H + Math.cos(time * 0.0001 * f.sp * 8 + f.ph) * 70;
      const g = ctx.createRadialGradient(x, y, 0, x, y, f.r);
      g.addColorStop(0, `rgba(${tint},${0.09 * intensity})`); g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  }
  function vignette(s) { const g = ctx.createRadialGradient(cx, cy * 0.92, H * 0.16, cx, cy, H * 0.92); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(0,0,0,${s})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  function scanlines(a) { ctx.fillStyle = `rgba(0,0,0,${a})`; for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1); }

  function drawComputer(time, attack, shield) {
    ctx.save(); ctx.translate(cx, cy);
    const col = shield ? "40,231,255" : attack > 0.35 ? "255,59,92" : "40,231,255";
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    const bg = ctx.createRadialGradient(0, 0, 8, 0, 0, 150);
    bg.addColorStop(0, `rgba(${col},${0.16 + 0.12 * attack + 0.06 * (shield ? 1 : 0)})`); bg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0, 0, 150, 0, TAU); ctx.fill(); ctx.restore();
    const stroke = shield ? "#28e7ff" : attack > 0.35 ? "#ff3b5c" : "#244a58";
    ctx.fillStyle = "#0b1822"; ctx.strokeStyle = stroke; ctx.lineWidth = 2;
    roundRect(-15, 38, 30, 16, 3); ctx.fill(); ctx.stroke();
    roundRect(-36, 52, 72, 8, 3); ctx.fill(); ctx.stroke();
    ctx.shadowColor = shield ? "rgba(40,231,255,.7)" : attack > 0.35 ? "rgba(255,59,92,.6)" : "rgba(40,231,255,.3)"; ctx.shadowBlur = 28;
    ctx.fillStyle = "#081119"; roundRect(-66, -48, 132, 86, 12); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
    const sc = ctx.createLinearGradient(0, -42, 0, 32);
    if (shield) { sc.addColorStop(0, "#0a3a44"); sc.addColorStop(1, "#06181f"); }
    else if (attack > 0.35) { sc.addColorStop(0, "#3c0f18"); sc.addColorStop(1, "#190608"); }
    else { sc.addColorStop(0, "#0c2832"); sc.addColorStop(1, "#06141a"); }
    ctx.fillStyle = sc; roundRect(-57, -40, 114, 70, 7); ctx.fill();
    ctx.save(); roundRect(-57, -40, 114, 70, 7); ctx.clip();
    ctx.globalAlpha = 0.14; ctx.strokeStyle = "#000"; for (let y = -40; y < 30; y += 4) { ctx.beginPath(); ctx.moveTo(-57, y); ctx.lineTo(57, y); ctx.stroke(); }
    ctx.globalAlpha = 0.05 + 0.06 * Math.random(); ctx.fillStyle = attack > 0.35 ? "#ff3b5c" : "#28e7ff"; ctx.fillRect(-57, -40, 114, 70);
    if (attack > 0.45) { ctx.globalAlpha = attack; ctx.strokeStyle = "rgba(255,130,150,.9)"; ctx.lineWidth = 1.3; ctx.shadowColor = "rgba(255,59,92,.8)"; ctx.shadowBlur = 8; for (const p of cracks) { ctx.beginPath(); p.forEach((pt, i) => i ? ctx.lineTo(pt[0], pt[1]) : ctx.moveTo(pt[0], pt[1])); ctx.stroke(); } ctx.shadowBlur = 0; }
    ctx.restore();
    ctx.fillStyle = shield ? "#8ff3ff" : attack > 0.35 ? "#ff90a2" : "#3fd0e8"; ctx.font = "800 24px 'JetBrains Mono',monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(shield ? ":)" : attack > 0.35 ? ":(" : "•_•", 0, -6);
    ctx.restore();
  }

  function drawMonster(m, emerge, rush, time) {
    const r = lerp(m.spawn, m.rest, rush);
    const bob = Math.sin(time * 0.002 * m.ws + m.wob) * 6;
    const x = cx + Math.cos(m.a) * r, y = cy + Math.sin(m.a) * r * 0.82 + bob;
    const s = m.size, col = m.threat ? "255,60,92" : "70,225,255";
    ctx.save(); ctx.translate(x, y); ctx.globalAlpha = emerge;
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    const ag = ctx.createRadialGradient(0, 0, 2, 0, 0, s * 2.3); ag.addColorStop(0, `rgba(${col},0.26)`); ag.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(0, 0, s * 2.3, 0, TAU); ctx.fill(); ctx.restore();
    ctx.strokeStyle = `rgba(${col},0.5)`; ctx.lineWidth = 2.2; ctx.lineCap = "round";
    for (let k = 0; k < m.tcount; k++) {
      const ta = (k / m.tcount) * TAU + m.tphase;
      const len = s * (1.35 + 0.5 * Math.sin(time * 0.004 + k));
      const sw = Math.sin(time * 0.005 + k * 1.3) * s * 0.6;
      ctx.beginPath(); ctx.moveTo(Math.cos(ta) * s * 0.5, Math.sin(ta) * s * 0.5);
      ctx.quadraticCurveTo(Math.cos(ta) * len - Math.sin(ta) * sw, Math.sin(ta) * len + Math.cos(ta) * sw, Math.cos(ta) * len * 1.4, Math.sin(ta) * len * 1.4);
      ctx.stroke();
    }
    ctx.shadowColor = `rgba(${col},0.8)`; ctx.shadowBlur = 18;
    const body = ctx.createRadialGradient(0, -s * 0.2, 2, 0, 0, s);
    body.addColorStop(0, "rgba(8,3,6,0.96)"); body.addColorStop(0.7, `rgba(${col},0.18)`); body.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = body; ctx.beginPath();
    const pts = 16; for (let i = 0; i <= pts; i++) { const a = i / pts * TAU; const rr = s * (0.9 + 0.13 * Math.sin(a * 3 + time * 0.004 + m.wob)); const px = Math.cos(a) * rr, py = Math.sin(a) * rr * 1.04; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
    const blink = Math.sin(time * 0.003 + m.wob) > 0.95 ? 0.18 : 1;
    for (let i = 0; i < m.eyes; i++) {
      const off = (i - (m.eyes - 1) / 2) * s * 0.36, ey = -s * 0.08;
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      const eg = ctx.createRadialGradient(off, ey, 0, off, ey, s * 0.42); eg.addColorStop(0, `rgba(${col},${0.9 * blink})`); eg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(off, ey, s * 0.42, 0, TAU); ctx.fill(); ctx.restore();
      ctx.fillStyle = `rgba(255,240,245,${blink})`; ctx.beginPath(); ctx.ellipse(off, ey, s * 0.12, s * 0.17, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = `rgb(${col})`; ctx.beginPath(); ctx.arc(off, ey, s * 0.06, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = `rgba(${col},0.85)`; ctx.lineWidth = 1.6; ctx.beginPath();
    for (let i = 0; i <= 6; i++) { const mx = -s * 0.42 + i * (s * 0.84 / 6); ctx.lineTo(mx, s * 0.34 + (i % 2 ? -s * 0.12 : s * 0.04)); } ctx.stroke();
    ctx.restore();
    return { x, y, col };
  }

  function burstEmbers(x, y, col) {
    for (let i = 0; i < 24; i++) { const a = Math.random() * TAU, sp = 1.5 + Math.random() * 6.5; embers.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1, life: 1, col, sz: 1.5 + Math.random() * 2.5 }); }
  }
  function drawEmbers() {
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    for (const p of embers) { if (p.life <= 0) continue; p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.vx *= 0.98; p.life -= 0.016;
      ctx.fillStyle = `rgba(${p.col},${p.life})`; ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.1, p.sz * p.life), 0, TAU); ctx.fill(); }
    ctx.restore(); embers = embers.filter((p) => p.life > 0);
  }
  function drawCharge(prog, time) {
    ctx.save(); ctx.translate(cx, cy); ctx.globalCompositeOperation = "lighter";
    const R0 = 230 * (1 - easeInOut(prog));
    for (let i = 0; i < 46; i++) { const a = i / 46 * TAU + time * 0.003; const rr = R0 + (i % 6) * 7; ctx.fillStyle = `rgba(40,231,255,${0.55 * prog})`; ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 1.8, 0, TAU); ctx.fill(); }
    ctx.strokeStyle = `rgba(40,231,255,${0.45 * prog})`; ctx.lineWidth = 2; ctx.shadowColor = "rgba(40,231,255,.9)"; ctx.shadowBlur = 22 * prog; hexPath(100); ctx.stroke();
    ctx.restore();
  }
  function drawShield(time, calm) {
    const R = 106 + Math.sin(time * 0.004) * 3;
    ctx.save(); ctx.translate(cx, cy); ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(0, 0, 40, 0, 0, R + 16); g.addColorStop(0, "rgba(40,231,255,0)"); g.addColorStop(0.82, `rgba(40,231,255,${0.07 + 0.04 * Math.sin(time / 200)})`); g.addColorStop(1, "rgba(40,231,255,0)");
    ctx.fillStyle = g; hexPath(R); ctx.fill();
    ctx.strokeStyle = "rgba(130,243,255,0.92)"; ctx.lineWidth = 3; ctx.shadowColor = "rgba(40,231,255,0.95)"; ctx.shadowBlur = 24; hexPath(R); ctx.stroke();
    ctx.shadowBlur = 0; ctx.strokeStyle = "rgba(40,231,255,0.22)"; ctx.lineWidth = 1; hexPath(R * 0.68); ctx.stroke(); hexPath(R * 0.4); ctx.stroke();
    const rot = time * 0.0016; ctx.strokeStyle = "rgba(190,250,255,0.9)"; ctx.lineWidth = 2.5; ctx.shadowBlur = 14; ctx.shadowColor = "rgba(40,231,255,.9)";
    for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(0, 0, R + 12, rot + k * 2.1, rot + k * 2.1 + 0.7); ctx.stroke(); }
    ctx.restore();
  }
  function drawShock(r, alpha) {
    ctx.save(); ctx.translate(cx, cy); ctx.globalCompositeOperation = "lighter";
    [["40,231,255", 0], ["54,255,176", 7], ["157,123,255", -7]].forEach(([c, off]) => { ctx.strokeStyle = `rgba(${c},${alpha})`; ctx.lineWidth = 3; ctx.shadowColor = `rgba(${c},.8)`; ctx.shadowBlur = 28; ctx.beginPath(); ctx.arc(0, 0, Math.max(0, r + off), 0, TAU); ctx.stroke(); });
    ctx.restore();
  }
  function drawArc(x2, y2, t) {
    ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.strokeStyle = `rgba(190,250,255,${t})`; ctx.lineWidth = 2; ctx.shadowColor = "rgba(40,231,255,.9)"; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(cx, cy); const segs = 7;
    for (let i = 1; i <= segs; i++) { const p = i / segs; const x = lerp(cx, x2, p) + (Math.random() - .5) * 20 * (1 - p); const y = lerp(cy, y2, p) + (Math.random() - .5) * 20 * (1 - p); ctx.lineTo(x, y); }
    ctx.stroke(); ctx.restore();
  }
  function titleTop(main, sub, color, glitch, big) {
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `900 ${big ? 38 : 30}px 'Orbitron','JetBrains Mono',monospace`;
    const dx = (Math.random() - .5) * glitch, dy = (Math.random() - .5) * glitch, y = H * 0.16;
    ctx.fillStyle = "rgba(255,59,92,0.5)"; ctx.fillText(main, cx - 2 + dx, y + dy);
    ctx.fillStyle = "rgba(40,231,255,0.5)"; ctx.fillText(main, cx + 2 - dx, y - dy);
    ctx.shadowColor = color; ctx.shadowBlur = 20; ctx.fillStyle = color; ctx.fillText(main, cx, y); ctx.shadowBlur = 0;
    ctx.font = "600 12px 'JetBrains Mono',monospace"; ctx.fillStyle = "rgba(159,195,207,0.85)"; ctx.fillText(sub, cx, y + (big ? 34 : 28));
  }

  function render(e) {
    const time = performance.now();
    const introP = clamp01((e - M.intro) / D.intro), assaultP = clamp01((e - M.assault) / D.assault);
    const chargeP = clamp01((e - M.charge) / D.charge), sinceBurst = e - M.burst;
    const annihP = clamp01((e - M.burst) / D.annih), securedP = clamp01((e - M.secured) / D.secured);
    const fadeP = clamp01((e - M.end) / D.fade);
    const shield = e >= M.burst;

    let amp = 0;
    if (e >= M.assault && e < M.charge) amp = 2 + 5 * assaultP;
    else if (e >= M.charge && e < M.burst) amp = 4 - 2 * chargeP;
    if (sinceBurst >= 0 && sinceBurst < 420) amp = Math.max(amp, 20 * (1 - sinceBurst / 420));
    sx = (Math.random() - .5) * amp; sy = (Math.random() - .5) * amp;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#03050a"; ctx.fillRect(0, 0, W, H);
    const threat = Math.max(introP * 0.55, assaultP) * (1 - annihP * 0.85);
    const defense = Math.max(chargeP * 0.7, shield ? 0.6 + 0.4 * securedP : 0);
    const tint = `${Math.round(20 + 150 * threat)},${Math.round(30 + 60 * defense)},${Math.round(40 + 120 * defense)}`;
    const fogI = (0.55 + 0.5 * threat) * (1 - annihP * 0.55) + securedP * 0.15;
    drawGrid(0.035 + 0.04 * defense, time);
    drawFog(time, fogI, tint);

    ctx.save(); ctx.translate(sx, sy);
    const attack = e < M.burst ? clamp01(introP * 0.35 + assaultP) : 0;
    drawComputer(time, attack, shield);
    if (e >= M.charge && e < M.burst) drawCharge(chargeP, time);
    if (shield) drawShield(time, securedP);

    const shockR = sinceBurst > 0 ? easeOut(clamp01(sinceBurst / (D.annih * 0.55))) * 660 : -1;
    for (const m of monsters) {
      if (!m.alive) continue;
      const emerge = clamp01((e - M.intro - m.delay) / 650) * (sinceBurst > 0 ? 1 : 1);
      if (emerge <= 0) continue;
      const rush = e >= M.charge ? 1 : easeInOut(assaultP);
      const pos = drawMonster(m, emerge, rush, time);
      if (shockR > 0 && Math.hypot(pos.x - cx, pos.y - cy) <= shockR) { m.alive = false; burstEmbers(pos.x, pos.y, pos.col); }
    }
    if (sinceBurst >= 0 && sinceBurst < 320) for (const m of monsters) { const x = cx + Math.cos(m.a) * m.rest, y = cy + Math.sin(m.a) * m.rest * 0.82; drawArc(x, y, 1 - sinceBurst / 320); }
    if (shockR > 0) drawShock(shockR, clamp01(1 - shockR / 660));
    drawEmbers();
    ctx.restore();

    if (sinceBurst >= 0 && sinceBurst < 300) { ctx.fillStyle = `rgba(232,250,255,${0.85 * (1 - sinceBurst / 300)})`; ctx.fillRect(0, 0, W, H); }
    scanlines(0.05); vignette(0.62 + 0.22 * threat);

    if (e < M.intro) titleTop("ИНИЦИАЛИЗАЦИЯ УЗЛА", "RVC // SECURITY NODE ONLINE", "#3fd0e8", 1);
    else if (e < M.assault) titleTop("ОБНАРУЖЕНО ВТОРЖЕНИЕ", "// INCOMING THREAT", "#ff5c78", 5);
    else if (e < M.charge) titleTop("АТАКА НА УЗЕЛ", "// NODE UNDER ATTACK", "#ff3b5c", 8);
    else if (e < M.burst) titleTop("ЗАРЯД ЩИТА", "// SHIELD CHARGING", "#7ff0ff", 2);
    else if (e < M.secured) titleTop("УГРОЗА УСТРАНЕНА", "// THREATS PURGED", "#36ffb0", 2);
    else { ctx.save(); ctx.globalAlpha = easeOut(clamp01(securedP * 1.6)); titleTop("СИСТЕМА ЗАЩИЩЕНА", "RVC // NODE SECURED", "#36ffb0", 1, true); ctx.restore(); }

    if (fadeP > 0) { ctx.fillStyle = `rgba(3,5,10,${fadeP})`; ctx.fillRect(0, 0, W, H); }
  }
  function frame(now) {
    if (t0 === null) t0 = now;
    const e = now - t0;
    render(e);
    if (e >= total) { finish(); return; }
    raf = requestAnimationFrame(frame);
  }
  window.__introFreeze = () => { done = true; cancelAnimationFrame(raf); };
  window.__introRender = (e) => { cancelAnimationFrame(raf); monsters.forEach((m) => (m.alive = true)); embers = []; render(e); };
  raf = requestAnimationFrame(frame);
  return prom;
}

const COLOR = {green:"green",yellow:"amber",red:"red"};   // band -> css class
const WORD  = {green:"реализуемо",yellow:"возможно",red:"не реализуемо"};
const SEV = {CRITICAL:"--sev-critical",HIGH:"--sev-high",MEDIUM:"--sev-medium",LOW:"--sev-low",UNKNOWN:"--sev-unknown"};
const STATE = {report:null, pos:"external", filter:"all", sel:null};

function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function band(a){return COLOR[a.qualitative.color]||"red";}
function countUp(el,to){ to=+to||0; let s=null;
  function f(ts){ if(s===null)s=ts; const p=Math.min(1,(ts-s)/480);
    el.textContent=Math.round(to*(1-Math.pow(1-p,3))); if(p<1)requestAnimationFrame(f); }
  requestAnimationFrame(f); }

async function load(refresh){
  const r = await fetch("/api/report"+(refresh?"?refresh=1":""));
  STATE.report = await r.json();
  if(!STATE.report.findings){ document.getElementById("detail").innerHTML='<div class="empty">Отчёт пуст или старого формата.</div>'; return; }
  renderShell(); renderList(); if(STATE.sel!=null) renderDetail();
}

function renderShell(){
  const m = STATE.report.meta;
  document.getElementById("target").innerHTML =
    `цель <b>${esc(m.target.ip||"—")}</b> · ${esc(m.target.os||"OS —")} · портов снаружи <b>${(m.reachable_ports||[]).length}</b>`;
  // position tabs (две: снаружи / изнутри; разницу ролей показываем в детали по месту)
  const TABS=[{id:"external",grp:"Снаружи",lab:"внешний"},{id:"internal_user",grp:"Изнутри",lab:"инсайдер"}];
  if(STATE.pos!=="external"&&STATE.pos!=="internal_user")STATE.pos="external";
  document.getElementById("tabs").innerHTML = TABS.map(t=>
    `<div class="tab ${t.id===STATE.pos?"active":""}" data-pos="${t.id}"><span class="grp">${t.grp}</span>${t.lab}</div>`
  ).join("");
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{STATE.pos=t.dataset.pos;renderShell();renderList();if(STATE.sel!=null)renderDetail();});
  const pos = m.positions.find(p=>p.id===STATE.pos);
  document.getElementById("posdesc").innerHTML = `<b>${esc(pos.label)}.</b> ${esc(pos.description)}`;
  const c = m.counts.by_position[STATE.pos];
  document.getElementById("counts").innerHTML =
    `<div class="cnt green"><span class="dot"></span><span class="cnum" data-n="${c.realizable}">0</span><span class="lab">реализуемо</span></div>
     <div class="cnt amber"><span class="dot"></span><span class="cnum" data-n="${c.partially}">0</span><span class="lab">возможно</span></div>
     <div class="cnt red"><span class="dot"></span><span class="cnum" data-n="${c.not_realizable}">0</span><span class="lab">не реализуемо</span></div>`;
  document.querySelectorAll("#counts .cnum").forEach(el=>countUp(el,+el.dataset.n));
  document.getElementById("ports").textContent = "снаружи: "+(m.reachable_ports||[]).join(", ");
  // filters
  document.getElementById("filters").innerHTML =
    [["all","все"],["realizable","реализуемо"],["partially","возможно"],["not_realizable","не реализуемо"]]
    .map(([k,l])=>`<div class="chip ${STATE.filter===k?"active":""}" data-f="${k}">${l}</div>`).join("");
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{STATE.filter=c.dataset.f;renderShell();renderList();});
}

function sevColor(s){return getComputedStyle(document.documentElement).getPropertyValue(SEV[s]||SEV.UNKNOWN).trim();}

function badgeHTML(f,posId,emph){
  const a=f.assessments[posId];const b=band(a);
  return `<div class="badge ${b} ${emph?"emph":""}" data-fid="${f._id}" data-pos="${posId}">
    <span class="bgrp">${posId==="external"?"снаружи":posId==="internal_user"?"изнутри":"админ"}</span>
    <span class="bword">${WORD[a.qualitative.color]}</span></div>`;
}

function renderList(){
  const items = STATE.report.findings.map((f,i)=>({...f,_id:i}))
    .filter(f=>STATE.filter==="all" || f.assessments[STATE.pos].numeric.verdict===STATE.filter);
  const host = document.getElementById("cards");
  if(!items.length){host.innerHTML='<div class="empty">Нет атак под фильтром.</div>';return;}
  host.innerHTML = items.map((f,idx)=>{
    const a=f.assessments[STATE.pos];const sc=sevColor(a.severity);
    return `<div class="card ${STATE.sel===f._id?"sel":""}" data-id="${f._id}" style="animation-delay:${Math.min(idx*26,440)}ms">
      <div class="row1">
        <span class="sevtag" style="background:${sc}" title="Тяжесть уязвимости (CVSS): насколько опасна сама по себе, ЕСЛИ сработает — отдельно от реализуемости (цвета)">${esc(a.severity)}</span>
        <span class="nm">${esc(f.attack_name)}</span>
        ${f.port?`<span class="porttag">:${f.port}</span>`:""}
      </div>
      <div class="badges">
        ${badgeHTML(f,"external",STATE.pos==="external")}
        ${badgeHTML(f,"internal_user",STATE.pos!=="external")}
      </div></div>`;
  }).join("");
  host.querySelectorAll(".card").forEach(c=>c.onclick=()=>{STATE.sel=+c.dataset.id;renderList();renderDetail();});
  host.querySelectorAll(".badge").forEach(b=>{
    b.onmouseenter=e=>showTip(e,+b.dataset.fid,b.dataset.pos);
    b.onmousemove=moveTip; b.onmouseleave=hideTip;
  });
}

/* ----- tooltip with numeric breakdown ----- */
const tip=document.getElementById("tip");
function showTip(e,fid,posId){
  const f=STATE.report.findings[fid];const a=f.assessments[posId];const n=a.numeric;
  const cls={green:"#36ffb0",amber:"#ffc24d",red:"#ff3b5c"}[band(a)];
  let h=`<h5>${esc(a.position_label)}</h5>
    <div class="score" style="color:${cls}">${WORD[a.qualitative.color].toUpperCase()} · ${n.score}/100</div>
    <div class="thr">пороги: реализуемо ≥ ${n.thresholds.realizable_min}, возможно ≥ ${n.thresholds.possible_min} · база ${n.base}</div>`;
  n.factors.forEach(ft=>{
    const cl=ft.delta>0?"pos":ft.delta<0?"neg":"zero";const sg=ft.delta>0?"+":"";
    h+=`<div class="fline"><span class="fd ${cl}">${sg}${ft.delta}</span><span>${esc(ft.evidence)}</span></div>`;
  });
  (n.gates||[]).forEach(g=>h+=`<div class="gate">⛔ гейт: ${esc(g.evidence)}</div>`);
  tip.innerHTML=h;tip.style.display="block";moveTip(e);
}
function moveTip(e){
  const pad=14,w=tip.offsetWidth,hh=tip.offsetHeight;
  let x=e.clientX+pad,y=e.clientY+pad;
  if(x+w>innerWidth)x=e.clientX-w-pad; if(y+hh>innerHeight)y=innerHeight-hh-8;
  tip.style.left=x+"px";tip.style.top=y+"px";
}
function hideTip(){tip.style.display="none";}

/* ----- detail ----- */
function factsHTML(n){
  let h="";
  n.factors.forEach(ft=>{const cl=ft.delta>0?"pos":ft.delta<0?"neg":"zero";const sg=ft.delta>0?"+":"";
    h+=`<div class="fline"><span class="fd ${cl}">${sg}${ft.delta}</span><span><b>${esc(ft.label)}:</b> ${esc(ft.evidence)}</span></div>`;});
  (n.gates||[]).forEach(g=>h+=`<div class="fline"><span class="fd neg">⛔</span><span>${esc(g.evidence)}</span></div>`);
  h+=`<div class="fline"><span class="fd zero">=${n.score}</span><span class="zero">итог из базы ${n.base}, сумма ${n.raw_sum}${n.soft_cap_applied!=null?`, мягкий потолок ${n.soft_cap_applied}`:""}</span></div>`;
  return h;
}
function assessCol(f,posId){
  const a=f.assessments[posId];const b=band(a);const n=a.numeric;
  const verify=a.qualitative.verify||[];const gates=n.gates||[];
  const note = gates.length
      ? `<div class="verify gate">⛔ ${gates.map(g=>esc(g.evidence)).join("; ")}</div>`
      : (b!=="green" && verify.length) ? `<div class="verify">⚠ что уточнить: ${verify.map(esc).join("; ")}</div>` : "";
  return `<div class="acol">
    <div class="agrp">${esc(a.position_group)}</div>
    <div class="alab">${esc(a.position_label)}</div>
    <div class="verd ${b}"><span class="dot"></span>${WORD[a.qualitative.color]}</div>
    <div class="bar"><i class="${b}" style="width:${n.score}%"></i></div>
    <div class="just">${esc(a.qualitative.justification)}</div>
    ${note}
    <div class="factbtn" data-toggle="${posId}">▸ числа (${n.score}/100)</div>
    <div class="facts" data-facts="${posId}">${factsHTML(n)}</div>
  </div>`;
}
function assessColInternal(f){
  // Изнутри: базой берём права пользователя; разницу админа показываем пометкой,
  // только если она реально есть (для сетевых атак роль не влияет).
  const a=f.assessments.internal_user, adm=f.assessments.internal_admin;
  const b=band(a), n=a.numeric, verify=a.qualitative.verify||[], gates=n.gates||[];
  const note = gates.length
      ? `<div class="verify gate">⛔ ${gates.map(g=>esc(g.evidence)).join("; ")}</div>`
      : (b!=="green" && verify.length) ? `<div class="verify">⚠ что уточнить: ${verify.map(esc).join("; ")}</div>` : "";
  const diff = adm.numeric.verdict!==n.verdict || adm.numeric.score!==n.score;
  const admNote = diff
      ? `<div class="adminup">🔓 с правами администратора: <b class="${band(adm)}">${WORD[adm.qualitative.color]}</b> <span class="mono">(${adm.numeric.score}/100)</span> — выше за счёт прав роли</div>`
      : "";
  return `<div class="acol">
    <div class="agrp">Изнутри</div>
    <div class="alab">Внутренний атакующий (права пользователя)</div>
    <div class="verd ${b}"><span class="dot"></span>${WORD[a.qualitative.color]}</div>
    <div class="bar"><i class="${b}" style="width:${n.score}%"></i></div>
    <div class="just">${esc(a.qualitative.justification)}</div>
    ${note}${admNote}
    <div class="factbtn" data-toggle="internal_user">▸ числа (${n.score}/100)</div>
    <div class="facts" data-facts="internal_user">${factsHTML(n)}</div>
  </div>`;
}
function refRow(title,arr,fmt){
  if(!arr||!arr.length)return"";
  return `<div style="margin-bottom:8px"><div class="agrp" style="margin-bottom:4px">${title}</div>
    <div class="reflist">${arr.map(fmt).join("")}</div></div>`;
}
function methodicHTML(mt){
  if(!mt||!mt.phases)return'<div class="just">Методичка для этого семейства не задана.</div>';
  let h=`<div class="just" style="margin-bottom:12px">${esc(mt.summary||"")}</div>`;
  if(mt.prerequisites){h+=`<div class="agrp">Предусловия</div><ul class="tight">${mt.prerequisites.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;}
  mt.phases.forEach(p=>{
    h+=`<div class="phase"><div class="pname">▸ ${esc(p.name)}</div><div class="pgoal">${esc(p.goal||"")}</div>`;
    (p.steps||[]).forEach(s=>{
      h+=`<div class="step"><div class="act">${esc(s.action)}</div>
        <div class="cmd">${esc(s.command)}<span class="cp" data-cmd="${esc(s.command)}">copy</span></div>
        <div class="exp"><b>ожидаем:</b> ${esc(s.expected)}</div>
        <div class="why"><b>почему:</b> ${esc(s.explanation)}</div></div>`;
    });
    h+=`</div>`;
  });
  if(mt.tools){h+=`<div class="agrp" style="margin:10px 0 6px">Инструменты</div><div class="toolrow">${
    mt.tools.map(t=>`<div class="tool"><b>${esc(t.name)}</b> — <span class="pp">${esc(t.purpose)}</span><br><span class="ins">${esc(t.install)}</span></div>`).join("")}</div>`;}
  if(mt.troubleshooting){h+=`<div class="agrp" style="margin:10px 0 4px">Если не получается</div><ul class="tight">${mt.troubleshooting.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;}
  if(mt.cleanup){h+=`<div class="agrp" style="margin:10px 0 4px">Зачистка</div><ul class="tight">${mt.cleanup.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;}
  return h;
}
function defenseHTML(df){
  if(!df||!df.hardening)return'<div class="just">Методичка защиты не задана.</div>';
  const blk=(t,a)=>a&&a.length?`<div class="def"><h4>${t}</h4><ul class="tight">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
  return `<div class="just" style="margin-bottom:12px">${esc(df.summary||"")}</div>
    <div class="twocol">${blk("Обнаружение",df.detection)}${blk("Харднинг",df.hardening)}</div>
    <div class="twocol">${df.patch?`<div class="def"><h4>Патч</h4><div class="just">${esc(df.patch)}</div></div>`:""}${blk("Проверка",df.validation)}</div>`;
}
function renderDetail(){
  const f={...STATE.report.findings[STATE.sel],_id:STATE.sel};
  const ts=f.target_software||{},r=f.references||{};
  const hasRefs=(r.cve||[]).length||(r.cwe||[]).length||(r.capec||[]).length||(r.attack||[]).length;
  const prod=(ts.product&&ts.product!=="неизвестно")?` <span style="color:var(--muted)">· цель: ${esc(ts.product)} ${esc(ts.version_observed||"")}</span>`:"";
  document.getElementById("detail").innerHTML=`
    <div class="d-title">${esc(f.attack_name)}</div>
    <div class="d-sub">${esc(f.family_title||"")} · тип: <span class="mono">${esc(f.attack_type||"—")}</span>${f.port?` · порт <span class="mono">${f.port}</span>`:""}</div>
    <div class="gist"><b>Суть:</b> ${esc(ts.impact_if_exploited||"—")}${prod}</div>

    <div class="sec"><h3>Оценка по позициям атакующего<span class="hint">слова — для разбора, цифры — по кнопке</span></h3>
      <div class="assess two">${assessCol(f,"external")}${assessColInternal(f)}</div></div>

    <details class="sec"><summary>Методичка проведения атаки <span class="basis ${esc(f.methodic_basis||"")}">${esc(f.methodic_basis_label||"")}</span></summary>
      <div class="body">${methodicHTML(f.methodic)}</div></details>
    <details class="sec"><summary>Методичка защиты</summary><div class="body">${defenseHTML(f.defense)}</div></details>
    ${(hasRefs||ts.system_component)?`<details class="sec"><summary>Детали и ссылки MITRE</summary><div class="body">
      <div class="kv">
        <div class="k">Компонент</div><div class="v">${esc(ts.system_component||"—")}</div>
        <div class="k">Продукт</div><div class="v">${esc(ts.product||"—")} ${esc(ts.version_observed||"")}</div>
      </div>
      <div style="margin-top:10px">
        ${refRow("CVE",r.cve,c=>`<span class="ref"><b>${esc(c.id)}</b>${c.cvss?` · CVSS ${c.cvss}`:""}</span>`)}
        ${refRow("CWE",r.cwe,c=>`<span class="ref"><b>${esc(c.id)}</b> ${esc(c.name||"")}</span>`)}
        ${refRow("CAPEC",r.capec,c=>`<span class="ref"><b>${esc(c.id)}</b> ${esc(c.name||"")}</span>`)}
        ${refRow("ATT&CK",r.attack,c=>`<span class="ref"><b>${esc(c.id)}</b> ${esc(c.name||"")} ${c.tactic?`(${esc(c.tactic)})`:""}</span>`)}
      </div></div></details>`:""}`;
  // toggles & copy
  document.querySelectorAll(".factbtn").forEach(btn=>btn.onclick=()=>{
    document.querySelector(`.facts[data-facts="${btn.dataset.toggle}"]`).classList.toggle("open");
  });
  document.querySelectorAll(".cp").forEach(cp=>cp.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(cp.dataset.cmd);cp.textContent="ok";setTimeout(()=>cp.textContent="copy",900);});
  const dp=document.getElementById("detail"); dp.classList.remove("anim"); void dp.offsetWidth; dp.classList.add("anim");
}

document.getElementById("refresh").onclick=()=>load(true);
load(false);
playIntro();

/* ----- динамический фон: живая сеть узлов (свечение, мерцание, реакция на курсор) ----- */
(function bgfx(){
  const cv=document.getElementById("bgfx"); if(!cv) return;
  const ctx=cv.getContext("2d"); const dpr=Math.min(window.devicePixelRatio||1,2);
  let W,H,P; const mouse={x:-1e4,y:-1e4};
  addEventListener("mousemove",e=>{mouse.x=e.clientX*dpr;mouse.y=e.clientY*dpr;});
  addEventListener("mouseout",()=>{mouse.x=mouse.y=-1e4;});
  function size(){
    W=cv.width=Math.floor(innerWidth*dpr); H=cv.height=Math.floor(innerHeight*dpr);
    cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px";
    const N=Math.max(46, Math.min(96, Math.floor(innerWidth/16)));
    P=Array.from({length:N},()=>({
      x:Math.random()*W, y:Math.random()*H,
      vx:(Math.random()-.5)*0.30*dpr, vy:(Math.random()-.5)*0.30*dpr,
      r:(Math.random()*1.8+0.8)*dpr, ph:Math.random()*6.28, tw:0.6+Math.random()*1.3,
      big:Math.random()<0.28
    }));
  }
  size(); addEventListener("resize", size);
  const LINK=150*dpr, MLINK=210*dpr; let t=0;
  function loop(){
    t+=0.016; ctx.clearRect(0,0,W,H);
    for(const p of P){ p.x+=p.vx; p.y+=p.vy;
      const mdx=mouse.x-p.x, mdy=mouse.y-p.y, md=Math.hypot(mdx,mdy)||1;
      if(md<MLINK){ p.x+=mdx/md*0.22*dpr; p.y+=mdy/md*0.22*dpr; }
      if(p.x<0||p.x>W) p.vx*=-1; if(p.y<0||p.y>H) p.vy*=-1;
      p.x=Math.max(0,Math.min(W,p.x)); p.y=Math.max(0,Math.min(H,p.y)); }
    // связи между узлами
    for(let i=0;i<P.length;i++){ for(let j=i+1;j<P.length;j++){
      const a=P[i],b=P[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);
      if(d<LINK){ ctx.strokeStyle="rgba(40,231,255,"+(0.17*(1-d/LINK)).toFixed(3)+")";
        ctx.lineWidth=dpr*0.8; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); } } }
    // связи к курсору (ярче)
    for(const p of P){ const dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.hypot(dx,dy);
      if(d<MLINK){ ctx.strokeStyle="rgba(130,243,255,"+(0.24*(1-d/MLINK)).toFixed(3)+")";
        ctx.lineWidth=dpr; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(mouse.x,mouse.y); ctx.stroke(); } }
    // узлы со свечением (аддитивно) + мерцание
    ctx.globalCompositeOperation="lighter";
    for(const p of P){
      const tw=0.55+0.45*Math.sin(t*p.tw+p.ph);
      const R=(p.big?p.r*2.6:p.r*1.5);
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R*3.2);
      g.addColorStop(0,"rgba(60,231,255,"+(0.28+0.42*tw).toFixed(3)+")");
      g.addColorStop(1,"rgba(40,231,255,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,R*3.2,0,6.2832); ctx.fill();
      ctx.fillStyle="rgba(200,250,255,"+(0.55+0.4*tw).toFixed(3)+")";
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.85,0,6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation="source-over";
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
